    { id: 'tron', name: 'Królewski tron', price: 750, x: 92, svg: '<path d="M26 8L38 18L50 6L62 18L74 8V60H26Z" fill="#7A1F3D"/><path d="M18 60H82V76H18Z" fill="#E3B341"/><path d="M26 76V96M74 76V96" stroke="#E3B341" stroke-width="8"/><circle cx="50" cy="34" r="7" fill="#E5403A"/>' }
  ];
  const itemById = (id) => ITEMS.find((i) => i.id === id) || null;

  // Wnętrze sceny: tło i postawione przedmioty
  function sceneInner(bgId, itemIds) {
    return bgSvg(bgById(bgId)) + itemIds.map(itemById).filter(Boolean)
      .map((i) => '<div class="scene-item" style="left:' + i.x + '%">' + itemSvg(i.svg) + '</div>').join('');
  }

  // Cała postać: nogi, tułów i głowa z kapeluszem to osobne warstwy, żeby mogły się ruszać.
  // still = bez animacji, np. obrazek na półce w sklepie
  function avatarSvg(hat, pet, still) {
    pet = pet || PETS[0];
    const hatLayer = hat
      ? '<g class="ava-px" data-depth="40"><g transform="translate(65 -136) scale(2.917) rotate(-6 60 90)" fill="none" stroke-width="4"><g class="ava-hat">' + hat.svg + '</g></g></g>'
      : '';
    return '<svg class="' + (still ? 'ava-still' : 'ava') + '" viewBox="-110 -200 680 870" role="img" aria-label="' + pet.name + (hat ? ' w kapeluszu: ' + hat.name : '') + '">' +
      '<g class="ava-px" data-depth="20"><g class="ava-all" stroke="' + INK + '" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">' +
      pet.leg('leg-b', 250) + pet.leg('leg-a', 150) +
      '<g class="ava-dodo">' + pet.body +
      // Głowa obraca się wokół nasady szyi: ava-droop = smutek, ava-look = patrzenie za palcem
      '<g transform="translate(228 345)"><g class="ava-droop"><g class="ava-look"><g transform="translate(-228 -345)">' + pet.head + hatLayer + '</g></g></g></g>' +
      '</g></g></g></svg>';
  }

  let tasks = [];
  let cats = [];   // kategorie w kolejności tworzenia: { id, name, collapsed }
  let dailies = []; // zadania codzienne: { id, text, order, doneDate } — zrobione, gdy doneDate to dzisiejsza data
  let dailyDoneCollapsed = true;
  let filter = 'active';

  // Dzisiejsza data jako 'RRRR-MM-DD' (czas lokalny telefonu). Nowy dzień = codzienne wracają same.
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function doneToday(d) { return d.doneDate === today(); }
  // Przesunięcie daty 'RRRR-MM-DD' o n dni
  function shiftDay(s, n) {
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function clean(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      text: String((raw && raw.text) || '').slice(0, 200),
      done: !!(raw && raw.done),
      createdAt: Number(raw && raw.createdAt) || 0,
      order: Number.isFinite(Number(raw && raw.order)) && raw.order !== null && raw.order !== '' ? Number(raw.order) : null,
      cat: raw && raw.cat ? String(raw.cat) : null,
      hpGain: Number(raw && raw.hpGain) || 0 // ile serduszek faktycznie dało odhaczenie
    };
  }
  function cleanDaily(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      text: String((raw && raw.text) || '').slice(0, 200),
      order: Number(raw && raw.order) || 0,
      doneDate: raw && raw.doneDate ? String(raw.doneDate) : null,
      // Od tego dnia zadanie liczy się do rozliczenia (starsze zapisy: od dziś)
      createdDate: raw && raw.createdDate ? String(raw.createdDate) : today(),
      hpGain: Number(raw && raw.hpGain) || 0
    };
  }
  function cleanCat(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      name: String((raw && raw.name) || '').slice(0, 40),
      collapsed: !!(raw && raw.collapsed)
    };
  }

  // Kolejność na liście: mniejsza liczba = wyżej. Niezrobione zawsze nad zrobionymi.
  function byOrder(a, b) { return (a.done - b.done) || (a.order - b.order); }
  function topOrder() {
    return tasks.reduce((m, t) => Math.min(m, t.order), 0) - 1;
  }
  function catById(id) { return cats.find((c) => c.id === id) || null; }
  function shortText(s) { return s.length > 28 ? s.slice(0, 28) + '…' : s; }
  function zadan(n) {
    const last = n % 10, last2 = n % 100;
    if (n === 1) return '1 zadanie';
    if (last >= 2 && last <= 4 && (last2 < 12 || last2 > 14)) return n + ' zadania';
    return n + ' zadań';
  }

  // ---------- Zapis w pamięci telefonu ----------
  function load() {
    let list = [];
    try { list = JSON.parse(lsGet(LS_CATS)) || []; } catch (e) {}
    cats = Array.isArray(list) ? list.map(cleanCat).filter((c) => c.name) : [];

    list = [];
    try { list = JSON.parse(lsGet(LS_TASKS)) || []; } catch (e) {}
    tasks = Array.isArray(list) ? list.map(clean).filter((t) => t.text) : [];
    // Zadanie z nieistniejącą kategorią trafia do „bez kategorii”
    tasks.forEach((t) => { if (t.cat && !catById(t.cat)) t.cat = null; });

    list = [];
    try { list = JSON.parse(lsGet(LS_DAILY)) || []; } catch (e) {}
    dailies = Array.isArray(list) ? list.map(cleanDaily).filter((d) => d.text) : [];
    dailyDoneCollapsed = lsGet(LS_DAILY_FOLD) !== '0';
    saveDaily(); // zapisuje createdDate starszym zadaniom

    let g = null;
    try { g = JSON.parse(lsGet(LS_GAME)); } catch (e) {}
    game = {
      hp: g && Number.isFinite(g.hp) ? Math.max(0, Math.min(MAX_HP, g.hp)) : MAX_HP,
      coins: g && Number.isFinite(g.coins) ? Math.max(0, g.coins) : 0,
      // Pierwsze uruchomienie: nic wstecz, pierwszym rozliczanym dniem będzie dzisiaj
      settled: g && g.settled ? String(g.settled) : shiftDay(today(), -1),
      owned: g && Array.isArray(g.owned) ? g.owned.filter(hatById) : [],
      hat: g && hatById(g.hat) ? g.hat : null,
      name: g && typeof g.name === 'string' && g.name.trim() ? g.name.trim().slice(0, 20) : 'Dodo',
      ownedBg: g && Array.isArray(g.ownedBg) ? g.ownedBg.filter((id) => BGS.some((b) => b.id === id)) : [],
      bg: 'statek',
      ownedPets: g && Array.isArray(g.ownedPets) ? g.ownedPets.filter((id) => PETS.some((p) => p.id === id)) : [],
      pet: 'dodo',
      ownedItems: g && Array.isArray(g.ownedItems) ? g.ownedItems.filter(itemById) : [],
      items: []
    };
    // Używać można tylko tego, co jest kupione
    if (g && game.ownedBg.includes(g.bg)) game.bg = g.bg;
    if (g && game.ownedPets.includes(g.pet)) game.pet = g.pet;
    if (g && Array.isArray(g.items)) game.items = g.items.filter((id) => game.ownedItems.includes(id));
    if (!game.owned.includes(game.hat)) game.hat = null;
    saveGame();
    // Starsze zapisy nie miały kolejności — nadaj ją wg dotychczasowego układu (najnowsze na górze)
    if (tasks.some((t) => t.order === null)) {
      tasks.sort((a, b) => (a.done - b.done) || (b.createdAt - a.createdAt));
      tasks.forEach((t, i) => { t.order = i; });
      save();
    }
  }
  function save() {
    if (!lsSet(LS_TASKS, JSON.stringify(tasks))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }
  function saveCats() {
    if (!lsSet(LS_CATS, JSON.stringify(cats))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }

  function saveDaily() {
    if (!lsSet(LS_DAILY, JSON.stringify(dailies))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }
  function saveGame() {
    if (!lsSet(LS_GAME, JSON.stringify(game))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }

  // Rozlicza wszystkie zakończone dni od ostatniego rozliczenia do wczoraj.
  // Zadanie liczy się jako zrobione danego dnia, gdy jego doneDate to ten dzień.
  function settleDays() {
    const t = today();
    let day = shiftDay(game.settled, 1);
    const result = { days: 0, done: 0, total: 0, hp: 0, lastDay: null };
    while (day < t) {
      for (const d of dailies) {
        if (d.createdDate > day) continue; // zadania jeszcze nie było
        result.total++;
        if (d.doneDate === day) result.done++;
      }
      result.days++;
      result.lastDay = day;
      day = shiftDay(day, 1);
    }
    if (!result.days) return null;

    const missed = result.total - result.done;
    const hpBefore = game.hp;
    game.hp = Math.max(0, game.hp - missed * HP_PER_MISS);
    game.settled = shiftDay(t, -1);
    saveGame();
    result.hp = game.hp - hpBefore;
    return result;
  }

  const ICON_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.2z" fill="#E5484D" stroke="#9E1F25" stroke-width="1.4"/></svg>';

  function showSummary(r) {
    const missed = r.total - r.done;
    let text;
    if (r.total === 0) {
      text = 'Nie miałeś jeszcze codziennych zadań. Dodaj je w zakładce „Codzienne”, żeby zbierać monety.';
    } else if (r.days === 1) {
      text = 'Wczoraj zrobiłeś ' + r.done + ' z ' + r.total + ' codziennych zadań.'
        + (missed === 0 ? ' Komplet, brawo!' : '');
    } else {
      const few = r.days % 10 >= 2 && r.days % 10 <= 4 && (r.days % 100 < 12 || r.days % 100 > 14);
      text = 'Od ostatniej wizyty ' + (few ? 'minęły ' : 'minęło ') + r.days + ' dni. Zrobione: ' + r.done + ', pominięte: ' + missed + '.';
    }
    if (game.hp === 0) text += ' Twój dodo nie ma już życia!';
    $('summaryText').textContent = text;
    $('summaryGains').innerHTML =
      '<span class="gain">' + ICON_HEART + (r.hp < 0 ? '−' + Math.abs(r.hp) + ' HP' : 'bez strat') + '</span>';
    $('summary').hidden = false;
  }
  $('summaryOk').addEventListener('click', () => {
    $('summary').hidden = true;
    renderProfile(true);
  });

  function renderProfile(animate) {
    const pct = Math.round((game.hp / MAX_HP) * 100);
    $('hpFill').style.width = pct + '%';
    $('hpText').textContent = game.hp + '/' + MAX_HP;
    $('hpBar').setAttribute('aria-valuenow', String(game.hp));
    $('hpBar').classList.toggle('low', game.hp <= MAX_HP * 0.5 && game.hp > MAX_HP * 0.2);
    $('hpBar').classList.toggle('critical', game.hp <= MAX_HP * 0.2);
    $('coins').textContent = game.coins;
    $('petName').textContent = game.name;
    // Rysujemy od nowa tylko po zmianie kapelusza, żeby nie przerywać animacji
    const sceneNow = game.bg + '|' + game.items.join(',');
    if (sceneKey !== sceneNow) {
      sceneKey = sceneNow;
      $('sceneArt').innerHTML = sceneInner(game.bg, game.items);
    }
    const avatarNow = (game.hat || '') + '|' + game.pet;
    if (avatarKey !== avatarNow) {
      avatarKey = avatarNow;
      $('avatar').innerHTML = avatarSvg(hatById(game.hat), petById(game.pet));
      const ava = $('avatar').querySelector('.ava');
      ava.classList.toggle('flipped', walker.dir < 0);
      ava.classList.toggle('walking', walker.walking);
    }
    applyMood();
    if (animate) {
      for (const el of [$('coins'), $('hpBar')]) {
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
    }
  }

  function addDaily(d) { dailies.push(d); saveDaily(); render(); }
  // Monety przyznawane od razu; cofnięcie odhaczenia je zabiera (żeby nie dało się ich nabijać)
  function addCoins(n) {
    game.coins = Math.max(0, game.coins + n);
    saveGame();
    renderProfile(true);
  }
  // Nagroda za odhaczenie. Życie ma limit, więc zapamiętujemy, ile faktycznie przybyło,
  // i przy cofnięciu zabieramy dokładnie tyle.
  function applyReward(item, done, coins, hp) {
    if (done) {
      const before = game.hp;
      game.hp = Math.min(MAX_HP, game.hp + hp);
      item.hpGain = game.hp - before;
    } else {
      game.hp = Math.max(0, game.hp - item.hpGain);
      item.hpGain = 0;
    }
    addCoins(done ? coins : -coins);
    if (done) reactAll(true);
  }
  function rewardText(done, coins, hp) {
    const sign = done ? '+' : '−';
    return sign + monet(coins) + (hp ? ', ' + sign + hp + (hp === 1 ? ' serduszko' : ' serduszka') : '');
  }
  function monet(n) {
    n = Math.abs(n);
    const last = n % 10, last2 = n % 100;
    if (n === 1) return '1 moneta';
    if (last >= 2 && last <= 4 && (last2 < 12 || last2 > 14)) return n + ' monety';
    return n + ' monet';
  }

  function setDailyDone(id, done) {
    const d = dailies.find((x) => x.id === id);
    if (!d) return;
    if (doneToday(d) !== done) applyReward(d, done, COINS_DAILY, HP_DAILY);
    d.doneDate = done ? today() : null; saveDaily(); render();
  }
  function removeDaily(id) {
    dailies = dailies.filter((x) => x.id !== id); saveDaily(); render();
  }

  function addTask(t) { tasks.push(t); save(); render(); }
  function setDone(id, done) {
    const t = tasks.find((x) => x.id === id);
    // Zadanie trafia na górę swojej grupy (świeżo zrobione — na górę zrobionych)
    if (!t) return;
    if (t.done !== done) applyReward(t, done, COINS_TASK, HP_TASK);
    t.done = done; t.order = topOrder(); save(); render();
  }
  function moveItems(arr, ids, from, to) {
    // ids: elementy jednej listy w obecnej kolejności; przenosimy pozycję from → to
    const group = ids.map((id) => arr.find((t) => t.id === id)).filter(Boolean);
    const slots = group.map((t) => t.order).sort((a, b) => a - b);
    const [moved] = group.splice(from, 1);
    group.splice(to, 0, moved);
    group.forEach((t, i) => { t.order = slots[i]; });
  }
  function removeTasks(ids) {
    tasks = tasks.filter((x) => !ids.includes(x.id)); save(); render();
  }

  // ---------- Widok ----------
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_GRIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
  const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const LABEL_DONE = '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Zrobione</span>';
  const LABEL_RESTORE = '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Przywróć</span>';
  const LABEL_DELETE = '<span class="swipe-label del-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>Usuń</span>';

  // kind: 'task' (zwykłe zadanie) albo 'daily' (codzienne — „zrobione” znaczy zrobione dzisiaj)
  function buildItem(t, showCat, kind) {
    const done = kind === 'daily' ? doneToday(t) : t.done;
    const li = document.createElement('li');
    li.className = 'item' + (done ? ' done' : '');
    li.dataset.id = t.id;
    li.dataset.kind = kind || 'task';


    const text = document.createElement('span');
    text.className = 'text';
    const main = document.createElement('span');
    main.textContent = t.text;
    text.append(main);
    const c = showCat && t.cat ? catById(t.cat) : null;
    if (c) {
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = c.name;
      text.append(meta);
    }

    const grip = document.createElement('button');
    grip.className = 'grip';
    grip.type = 'button';
    grip.setAttribute('aria-label', 'Przeciągnij, aby zmienić kolejność');
    grip.innerHTML = ICON_GRIP;

    const bg = document.createElement('div');
    bg.className = 'swipe-bg';
    bg.setAttribute('aria-hidden', 'true');
    bg.innerHTML = (done ? LABEL_RESTORE : LABEL_DONE) + LABEL_DELETE;

    const row = document.createElement('div');
    row.className = 'row';
    if (done) {
      const status = document.createElement('span');
      status.className = 'status';
      status.setAttribute('aria-label', 'Zrobione');
      status.innerHTML = ICON_CHECK;
      row.append(status);
    }
    row.append(text, grip);
    li.append(bg, row);
    return li;
  }

  function buildList(items, showCat, emptyText, kind) {
    const ul = document.createElement('ul');
    ul.className = 'list';
    for (const t of items) ul.append(buildItem(t, showCat, kind));
    if (!items.length && emptyText) {
      const li = document.createElement('li');
      li.className = 'empty-row';
      li.textContent = emptyText;
      ul.append(li);
    }
    return ul;
  }

  function buildCategory(c, items) {
    const sec = document.createElement('section');
    sec.className = 'cat' + (c.collapsed ? ' collapsed' : '');
    sec.dataset.cat = c.id;

    const head = document.createElement('div');
    head.className = 'cat-head';

    const toggle = document.createElement('button');
    toggle.className = 'cat-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(!c.collapsed));
    toggle.innerHTML = ICON_CHEVRON;
    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = c.name;
    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = items.length;
    toggle.append(name, count);

    const add = document.createElement('button');
    add.className = 'cat-add';
    add.type = 'button';
    add.setAttribute('aria-label', 'Dodaj zadanie do: ' + c.name);
    add.innerHTML = ICON_PLUS;

    const more = document.createElement('button');
    more.className = 'cat-more';
    more.type = 'button';
    more.setAttribute('aria-label', 'Opcje kategorii ' + c.name);
    more.innerHTML = ICON_MORE;

    head.append(toggle, add, more);
    // Uchwyt ma sens dopiero, gdy jest co najmniej druga kategoria
    if (cats.length > 1) {
      const grip = document.createElement('button');
      grip.className = 'cat-grip';
      grip.type = 'button';
      grip.setAttribute('aria-label', 'Przeciągnij, aby przenieść kategorię ' + c.name);
      grip.innerHTML = ICON_GRIP;
      head.append(grip);
    }
    sec.append(head);
    if (!c.collapsed) sec.append(buildList(items, false, 'Brak zadań. Dotknij +, aby dodać.'));
    return sec;
  }

  // ---------- Sklep: cztery półki ----------
  const ICON_COIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F5B301" stroke="#9A6A00" stroke-width="1.4"/><circle cx="12" cy="12" r="6.8" fill="#FFD84D" stroke="#C98F00" stroke-width="1.2"/><path d="M10.2 9h2.3a3 3 0 010 6h-2.3z" fill="none" stroke="#9A6A00" stroke-width="1.6" stroke-linejoin="round"/></svg>';

  // kind: pick = zawsze coś wybrane, wear = można zdjąć, place = można mieć wiele naraz
  const SHELVES = [
    { id: 'bg', label: 'Tła', items: BGS, ownedKey: 'ownedBg', cur: 'bg', kind: 'pick', free: 'statek', art: (b) => bgSvg(b), flush: true },
    { id: 'hat', label: 'Ubrania', items: HATS, ownedKey: 'owned', cur: 'hat', kind: 'wear', art: (h) => h.svg_html },
    { id: 'pet', label: 'Zwierzęta', items: PETS, ownedKey: 'ownedPets', cur: 'pet', kind: 'pick', free: 'dodo', art: (p) => avatarSvg(null, p, true) },
    { id: 'item', label: 'Wyposażenie', items: ITEMS, ownedKey: 'ownedItems', cur: 'items', kind: 'place', art: (i) => itemSvg(i.svg) }
  ];
  let shelfId = 'bg';
  let preview = null; // przymiarka bez kupowania: id rzeczy z bieżącej półki

  const shelfNow = () => SHELVES.find((s) => s.id === shelfId);
  const isOwned = (s, id) => id === s.free || game[s.ownedKey].includes(id);
  const isInUse = (s, id) => (s.kind === 'place' ? game.items.includes(id) : game[s.cur] === id);

  function renderShop(lists) {
    const shelf = shelfNow();

    // Co widać w podglądzie: to, czego używasz, plus ewentualna przymiarka
    const hat = hatById(shelf.id === 'hat' && preview ? preview : game.hat);
    const bgId = shelf.id === 'bg' && preview ? preview : game.bg;
    const pet = petById(shelf.id === 'pet' && preview ? preview : game.pet);
    const items = shelf.id === 'item' && preview && !game.items.includes(preview) ? game.items.concat(preview) : game.items;

    const shownItem = preview ? shelf.items.find((x) => x.id === preview) : null;
    const box = document.createElement('section');
    box.className = 'shop-preview';
    const stage = document.createElement('div');
    stage.className = 'shop-scene';
    stage.innerHTML = sceneInner(bgId, items) + '<div class="shop-pet">' + avatarSvg(hat, pet) + '</div>';
    box.append(stage);
    if (shownItem) {
      const name = document.createElement('p');
      name.className = 'shop-preview-name';
      name.textContent = shownItem.name;
      const note = document.createElement('p');
      note.className = 'shop-preview-note';
      note.textContent = isInUse(shelf, shownItem.id) ? 'W użyciu.' : isOwned(shelf, shownItem.id) ? 'Masz to już.' : 'Przymiarka za darmo · cena: ' + monet(shownItem.price);
      box.append(name, note);
    }
    lists.append(box);

    const tabs = document.createElement('div');
    tabs.className = 'shelves';
    for (const s of SHELVES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'shelf-tab';
      b.dataset.shelf = s.id;
      b.setAttribute('aria-pressed', String(s.id === shelf.id));
      b.textContent = s.label;
      tabs.append(b);
    }
    lists.append(tabs);

    const grid = document.createElement('div');
    grid.className = 'hat-grid';
    for (const it of shelf.items) {
      const owned = isOwned(shelf, it.id);
      const used = isInUse(shelf, it.id);
      let action;
      if (used && shelf.kind === 'pick') action = '<button class="hat-action worn" type="button" disabled>Wybrane</button>';
      else if (used) action = '<button class="hat-action worn" type="button" data-action="off">' + (shelf.kind === 'wear' ? 'Zdejmij' : 'Schowaj') + '</button>';
      else if (owned) action = '<button class="hat-action owned" type="button" data-action="use">' + ({ pick: 'Wybierz', wear: 'Załóż', place: 'Postaw' })[shelf.kind] + '</button>';
      else action = '<button class="hat-action" type="button" data-action="buy"' + (game.coins < it.price ? ' disabled' : '') + ' aria-label="Kup za ' + monet(it.price) + '">' + ICON_COIN + it.price + '</button>';
      const card = document.createElement('div');
      card.className = 'hat-card' + (preview === it.id ? ' previewed' : '');
      card.dataset.id = it.id;
      card.innerHTML =
        '<button class="hat-art' + (shelf.flush ? ' flush' : '') + '" type="button" aria-label="Przymierz: ' + it.name + '">' + shelf.art(it) + '</button>' +
        '<p class="hat-name">' + it.name + '</p>' + action;
      grid.append(card);
    }
    lists.append(grid);
    applyMood();
  }

  function useItem(shelf, id) {
    if (shelf.kind === 'place') { if (!game.items.includes(id)) game.items.push(id); }
    else game[shelf.cur] = id;
  }

  function buyItem(shelf, it) {
    if (isOwned(shelf, it.id) || game.coins < it.price) return;
    const prevCur = shelf.kind === 'place' ? game.items.slice() : game[shelf.cur];
    game.coins -= it.price;
    game[shelf.ownedKey].push(it.id);
    useItem(shelf, it.id);
    preview = null;
    saveGame(); renderProfile(true); render();
    reactAll(true);
    toast('Kupiono: „' + it.name + '” · −' + monet(it.price), () => {
      game.coins += it.price;
      game[shelf.ownedKey] = game[shelf.ownedKey].filter((id) => id !== it.id);
      if (shelf.kind === 'place') game.items = prevCur; else game[shelf.cur] = prevCur;
      saveGame(); renderProfile(true); render();
    });
  }

  function shopClick(e) {
    const stage = e.target.closest('.shop-scene');
    if (stage) { react(stage.querySelector('.ava'), false); return; }
    const tab = e.target.closest('.shelf-tab');
    if (tab) { shelfId = tab.dataset.shelf; preview = null; render(); return; }
    const card = e.target.closest('.hat-card');
    if (!card) return;
    const shelf = shelfNow();
    const it = shelf.items.find((x) => x.id === card.dataset.id);
    if (e.target.closest('.hat-art')) { preview = preview === it.id ? null : it.id; render(); return; }
    const btn = e.target.closest('.hat-action');
    if (!btn) return;
    if (btn.dataset.action === 'buy') { buyItem(shelf, it); return; }
    if (btn.dataset.action === 'use') useItem(shelf, it.id);
    else if (shelf.kind === 'place') game.items = game.items.filter((id) => id !== it.id);
    else game.hat = null;
    preview = null;
    saveGame(); renderProfile(false); render();
  }

  // Sekcja „Zrobione dziś” w zakładce Codzienne — zwijana jak kategoria, bez + i ⋯
  function buildDailyDone(items) {
    const sec = document.createElement('section');
    sec.className = 'cat' + (dailyDoneCollapsed ? ' collapsed' : '');
    sec.dataset.section = 'dailydone';
    const head = document.createElement('div');
    head.className = 'cat-head';
    const toggle = document.createElement('button');
    toggle.className = 'cat-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(!dailyDoneCollapsed));
    toggle.innerHTML = ICON_CHEVRON;
    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = 'Zrobione dziś';
    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = items.length;
    toggle.append(name, count);
    head.append(toggle);
    sec.append(head);
    if (!dailyDoneCollapsed) sec.append(buildList(items, false, '', 'daily'));
    return sec;
  }

  function buildProgress(done, total) {
    const box = document.createElement('div');
    box.className = 'progress';
    box.innerHTML =
      '<div class="progress-top"><span class="progress-label">' + (done === total ? 'Komplet na dziś!' : 'Dzisiejszy postęp') + '</span>' +
      '<span class="progress-num">' + done + ' z ' + total + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round((done / total) * 100) + '%"></div></div>';
    return box;
  }

  // Monety i serduszka lecą z odhaczonego zadania do paska na górze
  function flyRewards(from, coins, hp) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const send = (icon, target, delay) => {
      const el = document.createElement('div');
      el.className = 'fly';
      el.innerHTML = icon;
      document.body.append(el);
      const to = target.getBoundingClientRect();
      const x0 = from.left + from.width / 2 - 13, y0 = from.top + from.height / 2 - 13;
      const x1 = to.left + to.width / 2 - 13, y1 = Math.max(8, to.top + to.height / 2 - 13); // gdy strona jest przewinięta: do górnej krawędzi
      const a = el.animate([
        { transform: `translate(${x0}px, ${y0}px) scale(.6)`, opacity: 0 },
        { transform: `translate(${x0}px, ${y0 - 26}px) scale(1.25)`, opacity: 1, offset: .25 },
        { transform: `translate(${x1}px, ${y1}px) scale(.7)`, opacity: .9 }
      ], { duration: 720, delay: delay, easing: 'ease-in-out', fill: 'both' });
      a.onfinish = () => el.remove();
    };
    let delay = 0;
    for (let i = 0; i < coins; i++) { send(ICON_COIN, $('coins'), delay); delay += 110; }
    for (let i = 0; i < hp; i++) { send(ICON_HEART, $('hpBar'), delay); delay += 110; }
  }

  function render() {
    const activeCount = tasks.filter((t) => !t.done).length;
    const doneCount = tasks.length - activeCount;
    const dailyDoneCount = dailies.filter(doneToday).length;

    $('pageTitle').textContent = { active: 'Do zrobienia', done: 'Zrobione', daily: 'Codzienne', shop: 'Sklep' }[filter];
    $('scene').hidden = filter === 'shop'; // w sklepie jest duży podgląd
    centerPet();
    $('addLabel').textContent = filter === 'daily' ? 'Nowe codzienne' : 'Nowe zadanie';

    if (filter === 'daily') {
      $('count').textContent = 'Wracają każdego ranka';
    } else {
      $('count').textContent = tasks.length === 0 ? 'Brak zadań'
        : 'Do zrobienia: ' + activeCount + (doneCount ? ' · zrobione: ' + doneCount : '');
    }
    $('newCatBtn').hidden = filter === 'daily';

    document.querySelectorAll('.seg button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.filter === filter));
    });

    const sorted = tasks.slice().sort(byOrder);
    const lists = $('lists');
    lists.textContent = '';

    $('actions').hidden = filter === 'shop';
    if (filter === 'shop') {
      $('count').textContent = 'Wydaj swoje monety';
      renderShop(lists);
      lists.hidden = false;
      $('empty').hidden = true;
      $('clearDone').hidden = true;
      return;
    }

    if (filter === 'daily') {
      const all = dailies.slice().sort((a, b) => a.order - b.order);
      const todo = all.filter((d) => !doneToday(d));
      const doneNow = all.filter(doneToday);
      if (all.length) lists.append(buildProgress(dailyDoneCount, all.length));
      if (todo.length) lists.append(buildList(todo, false, '', 'daily'));
      else if (all.length) lists.append(buildList([], false, 'Wszystko na dziś zrobione! Jutro rano zadania wrócą.'));
      if (doneNow.length) lists.append(buildDailyDone(doneNow));
      lists.hidden = !lists.children.length;

      $('empty').hidden = all.length > 0;
      $('emptyTitle').textContent = 'Brak codziennych zadań';
      $('emptySub').textContent = 'Dodaj złotym przyciskiem to, co robisz każdego dnia, np. „Umyć zęby rano”. Każdego ranka wróci na listę.';
      $('clearDone').hidden = true;
      return;
    }

    if (filter === 'done') {
      const done = sorted.filter((t) => t.done);
      if (done.length) lists.append(buildList(done, true));
    } else {
      const active = sorted.filter((t) => !t.done);
      const loose = active.filter((t) => !t.cat);
      if (loose.length) lists.append(buildList(loose, false));
      for (const c of cats) lists.append(buildCategory(c, active.filter((t) => t.cat === c.id)));
    }
    lists.hidden = !lists.children.length;

    // Pusty stan: gdy nie ma czego pokazać (kategorie liczą się jako treść)
    const nothing = filter === 'done' ? doneCount === 0 : activeCount === 0 && cats.length === 0;
    $('empty').hidden = !nothing;
    if (tasks.length === 0 && cats.length === 0) {
      $('emptyTitle').textContent = 'Lista jest pusta';
      $('emptySub').textContent = 'Dotknij złotego przycisku, aby dodać pierwsze zadanie.';
    } else if (filter === 'active') {
      $('emptyTitle').textContent = 'Wszystko zrobione!';
      $('emptySub').textContent = 'Nic na Ciebie nie czeka.';
    } else {
      $('emptyTitle').textContent = 'Nic jeszcze nie odhaczono';
      $('emptySub').textContent = 'Przesuń zadanie w prawo, gdy je skończysz.';
    }

    const clear = $('clearDone');
    clear.hidden = doneCount === 0 || filter !== 'done';
    clear.textContent = 'Wyczyść zrobione (' + doneCount + ')';
  }

  // ---------- Komunikaty ----------
  let toastTimer = null;
  let undoAction = null;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    undoAction = undo || null;
    $('toastUndo').hidden = !undo;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; undoAction = null; }, undo ? 5000 : 3500);
  }
  $('toastUndo').addEventListener('click', () => {
    const fn = undoAction;
    $('toast').hidden = true; undoAction = null;
    if (fn) fn();
  });

  // ---------- Okienko ----------
  // mode: 'add' (nowe zadanie), 'edit' (zmiana zadania), 'newcat' (nowa kategoria), 'renamecat' (zmiana nazwy)
  const input = $('sheetInput');
  let sheet = null;          // { mode, taskId, catId }
  let pickedCat = null;      // kategoria zaznaczona w okienku zadania

  function renderChips() {
    const box = $('chips');
    box.textContent = '';
    const options = [{ id: null, name: 'Bez kategorii' }].concat(cats);
    for (const c of options) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.cat = c.id || '';
      b.setAttribute('aria-pressed', String(c.id === pickedCat));
      b.textContent = c.name;
      box.append(b);
    }
  }

  function openSheet(opts) {
    sheet = opts;
    // Dodatkowe tryby: 'adddaily' / 'editdaily' — zadanie codzienne (bez kategorii)
    const isTask = opts.mode === 'add' || opts.mode === 'edit';
    const isDaily = opts.mode === 'adddaily' || opts.mode === 'editdaily';
    const t = opts.mode === 'edit' ? tasks.find((x) => x.id === opts.taskId)
      : opts.mode === 'editdaily' ? dailies.find((x) => x.id === opts.taskId) : null;
    const c = opts.mode === 'renamecat' ? catById(opts.catId) : null;

    $('sheetTitle').textContent = {
      add: 'Nowe zadanie', edit: 'Zadanie', newcat: 'Nowa kategoria', renamecat: 'Zmień nazwę',
      adddaily: 'Codzienne zadanie', editdaily: 'Codzienne zadanie', petname: 'Imię dodo'
    }[opts.mode];
    $('sheetOk').textContent = ['add', 'newcat', 'adddaily'].includes(opts.mode) ? 'Dodaj' : 'Zapisz';
    const isPet = opts.mode === 'petname';
    input.placeholder = isPet ? 'np. Kapitan Dziób' : isDaily ? 'Co robisz codziennie? np. Umyć zęby rano'
      : isTask ? 'Co masz do zrobienia?' : 'Nazwa, np. Sport albo Praca';
    input.maxLength = isPet ? 20 : isTask || isDaily ? 200 : 40;
    input.value = isPet ? game.name : t ? t.text : c ? c.name : '';
    $('sheetOk').disabled = !input.value.trim();

    pickedCat = opts.mode === 'edit' && t ? t.cat : (opts.catId && isTask ? opts.catId : null);
    const showChips = isTask && cats.length > 0;
    $('chipsLabel').hidden = !showChips;
    $('chips').hidden = !showChips;
    if (showChips) renderChips();

    $('sheet').hidden = false;
    // Klawiatura od razu przy dodawaniu; przy zmianie zadania nie, żeby łatwo wybrać kategorię
    if (opts.mode !== 'edit') input.focus();
  }
  function closeSheet() {
    input.blur();
    $('sheet').hidden = true;
    sheet = null;
  }

  $('addBtn').addEventListener('click', () => openSheet({ mode: filter === 'daily' ? 'adddaily' : 'add' }));
  $('newCatBtn').addEventListener('click', () => openSheet({ mode: 'newcat' }));
  $('petNameBtn').addEventListener('click', () => openSheet({ mode: 'petname' }));
  $('sheetCancel').addEventListener('click', closeSheet);
  $('sheetBackdrop').addEventListener('click', closeSheet);
  input.addEventListener('input', () => { $('sheetOk').disabled = !input.value.trim(); });

  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    pickedCat = b.dataset.cat || null;
    $('chips').querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });

  $('sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !sheet) return;

    if (sheet.mode === 'add') {
      if (filter === 'done') { filter = 'active'; lsSet(LS_FILTER, filter); }
      const c = catById(pickedCat);
      if (c && c.collapsed) { c.collapsed = false; saveCats(); }
      addTask({ id: newId(), text: text, done: false, createdAt: Date.now(), order: topOrder(), cat: c ? c.id : null });
    } else if (sheet.mode === 'edit') {
      const t = tasks.find((x) => x.id === sheet.taskId);
      if (t) {
        const moved = t.cat !== pickedCat;
        t.text = text;
        t.cat = pickedCat;
        if (moved) {
          t.order = topOrder(); // w nowej kategorii ląduje na górze
          const c = catById(pickedCat);
          if (c && c.collapsed) { c.collapsed = false; saveCats(); }
        }
        save(); render();
        if (moved) toast('Przeniesiono do: ' + (catById(pickedCat) ? catById(pickedCat).name : 'Bez kategorii'));
      }
    } else if (sheet.mode === 'newcat') {
      if (filter === 'done') { filter = 'active'; lsSet(LS_FILTER, filter); }
      cats.push({ id: newId(), name: text, collapsed: false });
      saveCats(); render();
    } else if (sheet.mode === 'renamecat') {
      const c = catById(sheet.catId);
      if (c) { c.name = text; saveCats(); render(); }
    } else if (sheet.mode === 'petname') {
      game.name = text;
      saveGame(); renderProfile(false);
    } else if (sheet.mode === 'adddaily') {
      // Nowe codzienne trafia na koniec listy — kolejność dnia ustawiasz przeciąganiem
      const last = dailies.reduce((m, d) => Math.max(m, d.order), 0);
      addDaily({ id: newId(), text: text, order: last + 1, doneDate: null, createdDate: today() });
    } else if (sheet.mode === 'editdaily') {
      const d = dailies.find((x) => x.id === sheet.taskId);
      if (d) { d.text = text; saveDaily(); render(); }
    }
    closeSheet();
  });

  // ---------- Menu kategorii ----------
  let menuCat = null;
  function openMenu(catId) {
    const c = catById(catId);
    if (!c) return;
    menuCat = c.id;
    const n = tasks.filter((t) => t.cat === c.id).length;
    $('menuTitle').textContent = c.name;
    $('menuDelete').textContent = n ? 'Usuń kategorię i ' + zadan(n) : 'Usuń kategorię';
    $('menu').hidden = false;
  }
  function closeMenu() { $('menu').hidden = true; menuCat = null; }

  $('menuCancel').addEventListener('click', closeMenu);
  $('menuBackdrop').addEventListener('click', closeMenu);
  $('menuRename').addEventListener('click', () => {
    const id = menuCat;
    closeMenu();
    openSheet({ mode: 'renamecat', catId: id });
  });
  $('menuDelete').addEventListener('click', () => {
    const c = catById(menuCat);
    closeMenu();
    if (!c) return;
    const index = cats.indexOf(c);
    const removed = tasks.filter((t) => t.cat === c.id).map((t) => Object.assign({}, t));
    cats = cats.filter((x) => x !== c);
    tasks = tasks.filter((t) => t.cat !== c.id);
    saveCats(); save(); render();
    toast('Usunięto „' + shortText(c.name) + '”' + (removed.length ? ' i ' + zadan(removed.length) : ''), () => {
      cats.splice(Math.min(index, cats.length), 0, c);
      tasks = tasks.concat(removed);
      saveCats(); save(); render();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('petView').hidden) $('petView').hidden = true;
    else if (!$('summary').hidden) $('summaryOk').click();
    else if (!$('menu').hidden) closeMenu();
    else if (!$('sheet').hidden) closeSheet();
  });

  // ---------- Dotknięcia na liście ----------
  const lists = $('lists');

  lists.addEventListener('click', (e) => {
    if (Date.now() < suppressClickUntil) return; // klik po zakończonym geście
    if (filter === 'shop') { shopClick(e); return; }

    const sec = e.target.closest('.cat');
    if (e.target.closest('.cat-toggle')) {
      if (sec.dataset.section === 'dailydone') {
        dailyDoneCollapsed = !dailyDoneCollapsed;
        lsSet(LS_DAILY_FOLD, dailyDoneCollapsed ? '1' : '0');
        render();
        return;
      }
      const c = catById(sec.dataset.cat);
      if (c) { c.collapsed = !c.collapsed; saveCats(); render(); }
      return;
    }
    if (e.target.closest('.cat-add')) { openSheet({ mode: 'add', catId: sec.dataset.cat }); return; }
    if (e.target.closest('.cat-more')) { openMenu(sec.dataset.cat); return; }

    const li = e.target.closest('.item');
    if (!li) return;
    if (li.dataset.kind === 'daily') {
      const d = dailies.find((x) => x.id === li.dataset.id);
      if (!d) return;
      if (e.target.closest('.text')) openSheet({ mode: 'editdaily', taskId: d.id });
      return;
    }
    const t = tasks.find((x) => x.id === li.dataset.id);
    if (!t) return;
    if (e.target.closest('.text')) openSheet({ mode: 'edit', taskId: t.id });
  });

  // ---------- Gesty: przesunięcie w lewo / w prawo i przeciąganie za ≡ ----------
  let gesture = null;          // trwający gest: 'pending' | 'swipe' | 'drag'
  let suppressClickUntil = 0;
  let animating = false;       // trwa animacja odhaczania

  lists.addEventListener('pointerdown', (e) => {
    if (gesture || animating) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.cat-grip')) {
      e.preventDefault();
      startCatDrag(e.target.closest('.cat'), e);
      return;
    }
    const li = e.target.closest('.item');
    if (!li) return;
    if (e.target.closest('.grip')) {
      e.preventDefault();
      startDrag(li, e);
    } else {
      gesture = { type: 'pending', li: li, id: e.pointerId, x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener('pointermove', (e) => {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;

    if (g.type === 'pending') {
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        g.type = 'swipe';
        g.row = g.li.querySelector('.row');
        g.width = g.li.offsetWidth;
        try { g.li.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) {
        gesture = null; // to przewijanie listy, nie gest
        return;
      } else {
        return;
      }
    }

    if (g.type === 'swipe') {
      e.preventDefault();
      g.dx = e.clientX - g.x;
      g.row.style.transform = 'translateX(' + g.dx + 'px)';
      g.li.classList.toggle('to-right', g.dx > 0);
      g.li.classList.toggle('armed', Math.abs(g.dx) > g.width * 0.35);
    } else if (g.type === 'drag') {
      e.preventDefault();
      g.clientY = e.clientY;
      dragUpdate();
    }
  }, { passive: false });

  function endGesture(e, cancelled) {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;
    gesture = null;
    if (g.type === 'swipe') {
      suppressClickUntil = Date.now() + 400;
      if (!cancelled && g.li.classList.contains('armed')) completeBySwipe(g);
      else snapBack(g);
    } else if (g.type === 'drag') {
      suppressClickUntil = Date.now() + 400;
      endDrag(g, cancelled);
    }
  }
  window.addEventListener('pointerup', (e) => endGesture(e, false));
  window.addEventListener('pointercancel', (e) => endGesture(e, true));

  function snapBack(g) {
    g.row.style.transition = 'transform .2s ease';
    g.row.style.transform = '';
    g.li.classList.remove('armed');
    setTimeout(() => { g.row.style.transition = ''; g.li.classList.remove('to-right'); }, 220);
  }

  // Gest do końca: zadanie odjeżdża, tło na chwilę świeci (zielone / niebieskie / czerwone), wiersz się zwija.
  // W prawo = zrobione lub przywróć, w lewo = usuń.
  function completeBySwipe(g) {
    const isDaily = g.li.dataset.kind === 'daily';
    const t = (isDaily ? dailies : tasks).find((x) => x.id === g.li.dataset.id);
    if (!t) { snapBack(g); return; }
    const toRight = g.dx > 0;
    const fromRect = g.li.getBoundingClientRect();
    animating = true;
    g.row.style.transition = 'transform .2s ease-out';
    g.row.style.transform = toRight ? 'translateX(100%)' : 'translateX(-100%)';
    setTimeout(() => {
      g.li.style.height = g.li.offsetHeight + 'px';
      g.li.classList.add('collapsing');
      void g.li.offsetHeight;
      g.li.style.height = '0px';
    }, 450);
    setTimeout(() => {
      animating = false;
      if (isDaily) {
        if (!toRight) {
          const copy = Object.assign({}, t);
          removeDaily(t.id);
          toast('Usunięto codzienne: „' + shortText(copy.text) + '”', () => addDaily(copy));
          return;
        }
        const nowDone = !doneToday(t);
        const hpTaken = t.hpGain;
        setDailyDone(t.id, nowDone);
        if (nowDone) flyRewards(fromRect, COINS_DAILY, t.hpGain);
        toast((nowDone ? 'Zrobione na dziś: „' : 'Przywrócono: „') + shortText(t.text) + '” · '
          + rewardText(nowDone, COINS_DAILY, nowDone ? t.hpGain : hpTaken), () => setDailyDone(t.id, !nowDone));
        return;
      }
      if (!toRight) {
        const copy = Object.assign({}, t);
        removeTasks([t.id]);
        toast('Usunięto: „' + shortText(copy.text) + '”', () => addTask(copy));
        return;
      }
      const nowDone = !t.done;
      const hpTaken = t.hpGain;
      setDone(t.id, nowDone);
      if (nowDone) flyRewards(fromRect, COINS_TASK, t.hpGain);
      toast((nowDone ? 'Zrobione: „' : 'Przywrócono: „') + shortText(t.text) + '” · '
        + rewardText(nowDone, COINS_TASK, nowDone ? t.hpGain : hpTaken), () => setDone(t.id, !nowDone));
    }, 700);
  }

  // Przeciąganie działa w obrębie jednej listy (jednej kategorii)
  function startDrag(li, e) {
    const items = Array.from(li.parentElement.children).filter((el) => el.classList.contains('item'));
    const from = items.indexOf(li);
    const rects = items.map((el) => {
      const r = el.getBoundingClientRect();
      return { top: r.top + window.scrollY, h: r.height };
    });
    gesture = {
      type: 'drag', id: e.pointerId, li: li, items: items, from: from, to: from,
      lo: 0, hi: items.length - 1, rects: rects, gap: 0, startY: e.clientY + window.scrollY, clientY: e.clientY
    };
    li.classList.add('dragging');
    items.forEach((el) => { if (el !== li) el.classList.add('shifting'); });
    try { e.target.closest('.grip').setPointerCapture(e.pointerId); } catch (err) {}
    gesture.raf = requestAnimationFrame(autoScroll);
  }

  // Przeciąganie kategorii: zwijamy wszystkie do nagłówków, żeby łatwo było przenieść nawet długą
  function startCatDrag(sec, e) {
    const grip = e.target.closest('.cat-grip');
    const topBefore = sec.getBoundingClientRect().top;
    lists.classList.add('cats-dragging');
    // Po zwinięciu przewijamy tak, by nagłówek został pod palcem (o ile strona jest dość długa)
    window.scrollBy(0, sec.getBoundingClientRect().top - topBefore);
    const items = Array.from(lists.querySelectorAll(':scope > .cat'));
    const from = items.indexOf(sec);
    const rects = items.map((el) => {
      const r = el.getBoundingClientRect();
      return { top: r.top + window.scrollY, h: r.height };
    });
    gesture = {
      type: 'drag', kind: 'cat', id: e.pointerId, li: sec, items: items, from: from, to: from,
      lo: 0, hi: items.length - 1, rects: rects, gap: parseFloat(getComputedStyle(lists).rowGap) || 0,
      startY: e.clientY + window.scrollY, clientY: e.clientY
    };
    sec.classList.add('dragging');
    items.forEach((el) => { if (el !== sec) el.classList.add('shifting'); });
    try { grip.setPointerCapture(e.pointerId); } catch (err) {}
    gesture.raf = requestAnimationFrame(autoScroll);
  }

  function dragUpdate() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const r = g.rects, me = r[g.from];
    let dy = g.clientY + window.scrollY - g.startY;
    const minDy = r[g.lo].top - me.top;
    const maxDy = r[g.hi].top + r[g.hi].h - (me.top + me.h);
    dy = Math.max(minDy, Math.min(maxDy, dy));
    g.li.style.transform = 'translateY(' + dy + 'px)';

    // Zadanie zajmuje miejsce sąsiada, gdy jego krawędź minie połowę tego sąsiada
    const top = me.top + dy, bottom = top + me.h;
    let to = g.from;
    for (let i = g.from + 1; i <= g.hi; i++) if (bottom > r[i].top + r[i].h / 2) to = i;
    for (let i = g.from - 1; i >= g.lo; i--) if (top < r[i].top + r[i].h / 2) to = i;
    g.to = to;

    g.items.forEach((el, i) => {
      if (i === g.from) return;
      let shift = 0;
      if (g.from < i && i <= to) shift = -(me.h + g.gap);
      else if (to <= i && i < g.from) shift = me.h + g.gap;
      el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  }

  // Gdy palec jest przy górnej lub dolnej krawędzi ekranu, lista sama się przewija
  function autoScroll() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const edge = 80;
    let v = 0;
    if (g.clientY < edge) v = -(edge - g.clientY) / 6;
    else if (g.clientY > window.innerHeight - edge) v = (g.clientY - (window.innerHeight - edge)) / 6;
    if (v) { window.scrollBy(0, v); dragUpdate(); }
    g.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(g, cancelled) {
    cancelAnimationFrame(g.raf);
    if (g.kind === 'cat') {
      lists.classList.remove('cats-dragging');
      if (!cancelled && g.to !== g.from) {
        const [moved] = cats.splice(g.from, 1);
        cats.splice(g.to, 0, moved);
        saveCats();
      }
      render();
      return;
    }
    if (!cancelled && g.to !== g.from) {
      const ids = g.items.slice(g.lo, g.hi + 1).map((el) => el.dataset.id);
      if (g.li.dataset.kind === 'daily') { moveItems(dailies, ids, g.from - g.lo, g.to - g.lo); saveDaily(); }
      else { moveItems(tasks, ids, g.from - g.lo, g.to - g.lo); save(); }
    }
    render();
  }

  $('clearDone').addEventListener('click', () => {
    const doneTasks = tasks.filter((t) => t.done).map((t) => Object.assign({}, t));
    if (!doneTasks.length) return;
    removeTasks(doneTasks.map((t) => t.id));
    toast('Usunięto zrobione: ' + doneTasks.length, () => {
      tasks = tasks.concat(doneTasks); save(); render();
    });
  });

  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    preview = null;
    lsSet(LS_FILTER, filter);
    render();
  });

  // ---------- Żywy dodo: mruganie, oko za palcem, reakcje, nastrój ----------
  let avatarKey = null;      // kapelusz i zwierzę aktualnie narysowane u góry
  let sceneKey = null;       // tło i przedmioty aktualnie narysowane w scenie
  const walker = { x: null, dir: 1, walking: false }; // położenie dodo na pokładzie

  function applyMood() {
    const sad = game.hp <= MAX_HP * 0.2;
    document.querySelectorAll('.ava').forEach((a) => a.classList.toggle('sad', sad));
  }

  function react(ava, happy) {
    ava.classList.remove('hop', 'happy');
    void ava.getBoundingClientRect(); // restart animacji
    ava.classList.add('hop');
    if (happy) ava.classList.add('happy');
    clearTimeout(ava.reactTimer);
    ava.reactTimer = setTimeout(() => ava.classList.remove('hop', 'happy'), happy ? 1500 : 620);
  }
  function reactAll(happy) { document.querySelectorAll('.ava').forEach((a) => react(a, happy)); }

  // Oko patrzy za palcem, a gdy palca nie ma, rozgląda się samo
  let lookX = 0, lookY = 0, lookAt = 0, lookFrame = 0;
  let idle = { x: 12, y: 6 };
  function aimPupils() {
    lookFrame = 0;
    const following = Date.now() - lookAt < 2500;
    document.querySelectorAll('.ava').forEach((a) => {
      const eye = a.querySelector('.ava-eye');
      const r = eye.getBoundingClientRect();
      if (!r.width) return; // awatar ukryty albo oczy „radosne”
      let x = idle.x, y = a.classList.contains('sad') ? 10 : idle.y, headTurn = 0;
      if (following) {
        const box = a.getBoundingClientRect();
        // Gdy stoi, obraca się przodem do palca
        if (!a.classList.contains('walking') && Math.abs(lookX - (box.left + box.width / 2)) > 24) {
          const left = lookX < box.left + box.width / 2;
          a.classList.toggle('flipped', left);
          if (a === heroAva()) walker.dir = left ? -1 : 1;
        }
        const dx = lookX - (r.left + r.width / 2), dy = lookY - (r.top + r.height / 2);
        const d = Math.hypot(dx, dy) || 1, near = Math.min(1, d / 60);
        // Odbicie lustrzane zamienia lewo z prawem również dla źrenicy
        x = dx / d * 14 * near * (a.classList.contains('flipped') ? -1 : 1);
        y = dy / d * 18 * near;
        headTurn = Math.max(-12, Math.min(12, dy / d * 14));
      }
      a.querySelector('.ava-pupil').style.transform = 'translate(' + x + 'px,' + y + 'px)';
      a.querySelector('.ava-look').style.transform = 'rotate(' + headTurn + 'deg)';
    });
  }
  function onLook(e) {
    lookX = e.clientX; lookY = e.clientY; lookAt = Date.now();
    if (!lookFrame) lookFrame = requestAnimationFrame(aimPupils);
  }
  window.addEventListener('pointermove', onLook, { passive: true });
  window.addEventListener('pointerdown', onLook, { passive: true });

  // Chodzenie po pokładzie
  const pet = $('heroAvatar');
  const scene = $('scene');
  const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function heroAva() { return $('avatar').querySelector('.ava'); }
  function petRange() { return Math.max(16, scene.clientWidth - pet.offsetWidth - 16); }
  function placePet(x) {
    walker.x = x;
    pet.style.transform = 'translateX(' + x + 'px)';
  }
  function centerPet() {
    if (walker.x === null && scene.clientWidth) placePet((16 + petRange()) / 2);
  }
  function walkTo(target) {
    const ava = heroAva();
    if (calmMotion || walker.walking || walker.x === null || !ava) return;
    const x = Math.max(16, Math.min(petRange(), target));
    const dist = Math.abs(x - walker.x);
    if (dist < 12) return;
    walker.dir = x < walker.x ? -1 : 1;
    ava.classList.toggle('flipped', walker.dir < 0);
    ava.classList.add('walking');
    walker.walking = true;
    const seconds = dist / 48;
    pet.style.transition = 'transform ' + seconds + 's linear';
    placePet(x);
    setTimeout(() => {
      walker.walking = false;
      pet.style.transition = '';
      heroAva().classList.remove('walking');
    }, seconds * 1000);
  }
  window.addEventListener('resize', () => {
    if (walker.x !== null) placePet(Math.max(16, Math.min(petRange(), walker.x)));
  });

  // Czasem sam się przespaceruje albo rozejrzy
  (function wander() {
    setTimeout(() => {
      if (!document.hidden && $('petView').hidden && !scene.hidden && !gesture && Date.now() - lookAt > 1500) {
        if (Math.random() < 0.75) walkTo(16 + Math.random() * petRange());
        else if (!walker.walking) {
          walker.dir = -walker.dir;
          heroAva().classList.toggle('flipped', walker.dir < 0);
        }
      }
      wander();
    }, 3500 + Math.random() * 6000);
  })();

  // Czasem podchodzi zobaczyć, co robisz
  window.addEventListener('pointerdown', (e) => {
    if (scene.hidden || !$('petView').hidden || e.target.closest('.pet') || Math.random() > 0.35) return;
    walkTo(e.clientX - scene.getBoundingClientRect().left - pet.offsetWidth / 2);
  }, { passive: true });

  const IDLE_LOOKS = [{ x: 12, y: 6 }, { x: 12, y: 6 }, { x: -9, y: 4 }, { x: 14, y: -8 }, { x: 0, y: 9 }];
  setInterval(() => {
    if (document.hidden || Date.now() - lookAt < 2500) return;
    idle = IDLE_LOOKS[Math.floor(Math.random() * IDLE_LOOKS.length)];
    aimPupils();
  }, 2800);

  function blinkOnce() {
    const eyes = document.querySelectorAll('.ava-eye');
    eyes.forEach((e) => e.classList.add('blink'));
    setTimeout(() => eyes.forEach((e) => e.classList.remove('blink')), 130);
  }
  (function blinkLoop() {
    setTimeout(() => {
      if (!document.hidden) {
        blinkOnce();
        if (Math.random() < 0.2) setTimeout(blinkOnce, 260); // czasem mrugnie dwa razy
      }
      blinkLoop();
    }, 1800 + Math.random() * 4200);
  })();

  // Widok na cały ekran: dotknięcie = podskok, przesunięcie palcem = obrót
  const stage = $('petStage');
  let tilt = null;

  function moodText() {
    if (game.hp <= MAX_HP * 0.2) return 'Mało sił. Zrób codzienne zadania!';
    if (game.hp <= MAX_HP * 0.5) return 'Lekkie zmęczenie';
    return 'Świetny humor';
  }
  function openPet() {
    stage.innerHTML = avatarSvg(hatById(game.hat), petById(game.pet));
    $('petViewName').textContent = game.name;
    $('petMood').textContent = moodText();
    $('petView').hidden = false;
    applyMood();
    react(stage.querySelector('.ava'), false);
  }
  function setTilt(dx) {
    const amount = Math.max(-1, Math.min(1, dx / 140));
    stage.style.transform = amount ? 'perspective(700px) rotateY(' + amount * 26 + 'deg)' : '';
    stage.querySelectorAll('.ava-px').forEach((g) => {
      g.style.transform = amount ? 'translateX(' + amount * Number(g.dataset.depth) + 'px)' : '';
    });
  }

  $('heroAvatar').addEventListener('click', openPet);
  $('petClose').addEventListener('click', () => { $('petView').hidden = true; });

  stage.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    tilt = { id: e.pointerId, x: e.clientX, moved: false };
    stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', (e) => {
    if (!tilt || e.pointerId !== tilt.id) return;
    const dx = e.clientX - tilt.x;
    if (Math.abs(dx) > 8) tilt.moved = true;
    if (tilt.moved) setTilt(dx);
  });
  function endTilt(e) {
    if (!tilt || e.pointerId !== tilt.id) return;
    const tapped = !tilt.moved && e.type === 'pointerup';
    tilt = null;
    stage.classList.remove('dragging');
    setTilt(0); // wraca do środka
    if (tapped) react(stage.querySelector('.ava'), false);
  }
  stage.addEventListener('pointerup', endTilt);
  stage.addEventListener('pointercancel', endTilt);

  // ---------- Start ----------
  const savedFilter = lsGet(LS_FILTER);
  if (['active', 'done', 'daily', 'shop'].includes(savedFilter)) filter = savedFilter;

  function showDate() {
    try {
      $('today').textContent = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {}
  }

  showDate();
  load();
  const startSummary = settleDays();
  render();
  renderProfile(false);
  if (startSummary) showSummary(startSummary);

  // Nowy dzień: codzienne zadania wracają same, a poprzedni dzień zostaje rozliczony (monety / HP).
  // Sprawdzamy co pół minuty i przy każdym powrocie do appki (np. rano, gdy była otwarta w tle przez noc).
  let shownDay = today();
  function checkNewDay() {
    if (today() === shownDay) return;
    shownDay = today();
    showDate();
    const r = settleDays();
    if (!gesture && !animating) render();
    renderProfile(false);
    if (r) showSummary(r);
  }
  setInterval(checkNewDay, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);

  // Prośba, by system nie czyścił zapisanych zadań
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  // Działanie offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
