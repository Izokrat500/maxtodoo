<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dodo</title>

<!-- Appka na ekranie początkowym iPhone'a -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dodo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">

<style>
  /* Layout: jedna kolumna jak natywna lista iOS — duży tytuł, pole dodawania, przełącznik filtrów, grupowana lista na karcie */
  :root {
    --bg: #F2F3F7;
    --card: #FFFFFF;
    --fg: #16181D;
    --muted: #6B7180;
    --line: #E3E5EC;
    --accent: #2B63D9;
    --accent-fg: #FFFFFF;
    --danger: #D93A3A;
    --success: #2E9E5B;
    --done: #9AA0AD;
    --seg-bg: #E4E6ED;
    --seg-on: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 30, 60, .06);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0F12; --card: #1B1D22; --fg: #F1F2F5; --muted: #9097A3; --line: #2A2D34;
      --accent: #5B8DF5; --accent-fg: #0E0F12; --danger: #F06A6A; --success: #2FA862; --done: #6A707C;
      --seg-bg: #23262C; --seg-on: #3A3E47; --shadow: none;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body { margin: 0; font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; }
  .date { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  h1 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .count { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  .add-btn { width: 100%; height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; box-shadow: var(--shadow); transition: opacity .15s; }
  .add-btn:active { opacity: .8; }
  .add-btn svg { width: 26px; height: 26px; }

  /* Okienko „Nowe zadanie” — u góry ekranu, żeby klawiatura go nie zasłaniała */
  .sheet {
    position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 12, 18, .45); animation: fade .15s ease-out; }
  .sheet-card { position: relative; width: 100%; max-width: 528px; display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 16px; background: var(--card); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); animation: pop .18s ease-out; }
  .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .sheet-title { margin: 0; font-weight: 600; }
  .sheet-btn { justify-self: start; height: 44px; padding: 0 8px; color: var(--accent); font-size: 17px; }
  .sheet-btn.strong { justify-self: end; font-weight: 600; }
  .sheet-btn:disabled { opacity: .35; cursor: default; }
  .sheet-card input { height: 48px; margin-inline: 8px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--seg-bg); color: var(--fg); font: inherit; font-size: 17px; outline: none; }
  .sheet-card input::placeholder { color: var(--muted); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

  .seg { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--seg-bg); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { height: 34px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-selected="true"] { background: var(--seg-on); color: var(--fg); box-shadow: var(--shadow); }

  .list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .item { position: relative; background: var(--card); }

  /* Tło odsłaniane gestem: w lewo = zrobione (zielone) / przywróć (niebieskie), w prawo = usuń (czerwone) */
  .swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-inline: 20px; background: var(--danger); color: #FFFFFF; font-size: 15px; font-weight: 600; }
  .item.to-right .swipe-bg { background: var(--success); justify-content: flex-start; }
  .item.done.to-right .swipe-bg { background: var(--accent); }
  .swipe-label { display: flex; align-items: center; gap: 6px; opacity: .6; transform: scale(.92); transition: opacity .12s, transform .12s; }
  /* W lewo widać tylko „Usuń”, w prawo tylko „Zrobione” / „Przywróć” */
  .swipe-label.act-label, .item.to-right .swipe-label.del-label { display: none; }
  .item.to-right .swipe-label.act-label { display: flex; }
  .swipe-label svg { width: 20px; height: 20px; }
  .item.armed .swipe-label { opacity: 1; transform: none; }

  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 2px; min-height: 52px; padding-left: 4px; background: var(--card); touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .item + .item .row::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: 1px solid var(--line); }

  /* Przeciąganie */
  .item.dragging { z-index: 5; box-shadow: 0 10px 28px rgba(0, 0, 0, .2); }
  .item.dragging .row::before { display: none; }
  .item.shifting { transition: transform .18s ease; }
  .item.collapsing { overflow: hidden; transition: height .22s ease; }
  .grip { flex: none; width: 40px; height: 48px; display: grid; place-items: center; color: var(--done); touch-action: none; cursor: grab; }
  .grip svg { width: 20px; height: 20px; }
  .item.dragging .grip { color: var(--fg); cursor: grabbing; }

  .hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; text-align: center; text-wrap: balance; }
  .check { flex: none; width: 48px; height: 48px; display: grid; place-items: center; }
  .ring { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--done); display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .ring svg { width: 14px; height: 14px; color: var(--accent-fg); opacity: 0; transition: opacity .15s; }
  .item.done .ring { background: var(--success); border-color: var(--success); }
  .item.done .ring svg { opacity: 1; color: #FFFFFF; }
  .text { flex: 1; min-width: 0; padding-block: 13px; overflow-wrap: anywhere; }

  .empty { text-align: center; padding: 36px 16px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .empty-title { margin: 0; font-weight: 600; }
  .empty-sub { margin: 0; color: var(--muted); font-size: 15px; }

  .clear { align-self: center; height: 44px; padding: 0 16px; color: var(--accent); font-size: 15px; font-weight: 600; }


  .toast {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .toast-inner { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 528px; width: 100%; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 6px 6px 6px 16px; min-height: 52px; box-shadow: 0 6px 24px rgba(0,0,0,.18); animation: rise .2s ease-out; }
  .toast-msg { flex: 1; min-width: 0; font-size: 15px; }
  .toast-undo { height: 40px; padding: 0 14px; border-radius: 10px; color: var(--bg); font-weight: 700; font-size: 15px; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <p class="date" id="today"></p>
    <h1>Zadania</h1>
    <p class="count" id="count">&nbsp;</p>
  </header>

  <button class="add-btn" id="addBtn" type="button" aria-label="Dodaj zadanie" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="seg" role="tablist" aria-label="Pokaż">
    <button id="f-active" role="tab" data-filter="active" aria-selected="true">Do zrobienia</button>
    <button id="f-done" role="tab" data-filter="done" aria-selected="false">Zrobione</button>
  </div>

  <ul class="list" id="list" hidden></ul>
  <p class="hint" id="hint" hidden></p>

  <div class="empty" id="empty">
    <p class="empty-title" id="emptyTitle"></p>
    <p class="empty-sub" id="emptySub"></p>
  </div>

  <button class="clear" id="clearDone" hidden></button>
</main>

<!-- Okienko dodawania zadania -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <form class="sheet-card" id="addForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" autocomplete="off">
    <div class="sheet-head">
      <button class="sheet-btn" id="sheetCancel" type="button">Anuluj</button>
      <p class="sheet-title" id="sheetTitle">Nowe zadanie</p>
      <button class="sheet-btn strong" id="sheetAdd" type="submit" disabled>Dodaj</button>
    </div>
    <input id="newTask" type="text" maxlength="200" placeholder="Co masz do zrobienia?" enterkeyhint="done" aria-label="Treść zadania">
  </form>
</div>

<div class="toast" id="toast" hidden>
  <div class="toast-inner">
    <span class="toast-msg" id="toastMsg"></span>
    <button class="toast-undo" id="toastUndo" hidden>Cofnij</button>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const LS_TASKS = 'zadania-v1';
  const LS_FILTER = 'zadania-filtr';

  let tasks = [];
  let filter = 'active';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function clean(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      text: String((raw && raw.text) || '').slice(0, 200),
      done: !!(raw && raw.done),
      createdAt: Number(raw && raw.createdAt) || 0,
      order: Number.isFinite(Number(raw && raw.order)) && raw.order !== null && raw.order !== '' ? Number(raw.order) : null
    };
  }

  // Kolejność na liście: mniejsza liczba = wyżej. Niezrobione zawsze nad zrobionymi.
  function byOrder(a, b) { return (a.done - b.done) || (a.order - b.order); }
  function topOrder() {
    return tasks.reduce((m, t) => Math.min(m, t.order), 0) - 1;
  }

  // ---------- Zapis w pamięci telefonu ----------
  function load() {
    let list = [];
    try { list = JSON.parse(lsGet(LS_TASKS)) || []; } catch (e) {}
    tasks = Array.isArray(list) ? list.map(clean).filter((t) => t.text) : [];
    // Starsze zapisy nie miały kolejności — nadaj ją wg dotychczasowego układu (najnowsze na górze)
    if (tasks.some((t) => t.order === null)) {
      tasks.sort((a, b) => (a.done - b.done) || (b.createdAt - a.createdAt));
      tasks.forEach((t, i) => { t.order = i; });
      save();
    }
  }
  function save() {
    if (!lsSet(LS_TASKS, JSON.stringify(tasks))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }

  function addTask(t) { tasks.push(t); save(); render(); }
  function setDone(id, done) {
    const t = tasks.find((x) => x.id === id);
    // Zadanie trafia na górę swojej grupy (świeżo zrobione — na górę zrobionych)
    if (t) { t.done = done; t.order = topOrder(); save(); render(); }
  }
  function moveTask(ids, from, to) {
    // ids: zadania jednej grupy w obecnej kolejności; przenosimy pozycję from → to
    const group = ids.map((id) => tasks.find((t) => t.id === id)).filter(Boolean);
    const slots = group.map((t) => t.order).sort((a, b) => a - b);
    const [moved] = group.splice(from, 1);
    group.splice(to, 0, moved);
    group.forEach((t, i) => { t.order = slots[i]; });
    save();
  }
  function removeTasks(ids) {
    tasks = tasks.filter((x) => !ids.includes(x.id)); save(); render();
  }

  // ---------- Widok ----------
  function render() {
    const active = tasks.filter((t) => !t.done).length;
    const done = tasks.length - active;

    $('count').textContent = tasks.length === 0 ? 'Brak zadań'
      : 'Do zrobienia: ' + active + (done ? ' · zrobione: ' + done : '');

    document.querySelectorAll('.seg button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.filter === filter));
    });

    const sorted = tasks.slice().sort(byOrder);
    const shown = sorted.filter((t) => (filter === 'done' ? t.done : !t.done));

    const list = $('list');
    list.textContent = '';
    for (const t of shown) {
      const li = document.createElement('li');
      li.className = 'item' + (t.done ? ' done' : '');
      li.dataset.id = t.id;

      const check = document.createElement('button');
      check.className = 'check';
      check.type = 'button';
      check.setAttribute('aria-label', t.done ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione');
      check.innerHTML = '<span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>';

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = t.text;

      const grip = document.createElement('button');
      grip.className = 'grip';
      grip.type = 'button';
      grip.setAttribute('aria-label', 'Przeciągnij, aby zmienić kolejność');
      grip.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';

      const bg = document.createElement('div');
      bg.className = 'swipe-bg';
      bg.setAttribute('aria-hidden', 'true');
      bg.innerHTML = t.done
        ? '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Przywróć</span>'
        : '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Zrobione</span>';
      bg.innerHTML += '<span class="swipe-label del-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>Usuń</span>';

      const row = document.createElement('div');
      row.className = 'row';
      row.append(check, text, grip);
      li.append(bg, row);
      list.append(li);
    }
    list.hidden = shown.length === 0;
    $('hint').hidden = shown.length === 0;
    $('hint').textContent = filter === 'done'
      ? 'W prawo — przywróć do zrobienia. W lewo — usuń. Przeciągnij za ≡, aby zmienić kolejność.'
      : 'W prawo — zrobione. W lewo — usuń. Przeciągnij za ≡, aby zmienić kolejność.';

    $('empty').hidden = shown.length > 0;
    if (tasks.length === 0) {
      $('emptyTitle').textContent = 'Lista jest pusta';
      $('emptySub').textContent = 'Dotknij niebieskiego przycisku +, aby dodać pierwsze zadanie.';
    } else if (filter === 'active') {
      $('emptyTitle').textContent = 'Wszystko zrobione!';
      $('emptySub').textContent = 'Nic na Ciebie nie czeka.';
    } else {
      $('emptyTitle').textContent = 'Nic jeszcze nie odhaczono';
      $('emptySub').textContent = 'Przesuń zadanie w prawo, gdy je skończysz.';
    }

    const clear = $('clearDone');
    clear.hidden = done === 0 || filter !== 'done';
    clear.textContent = 'Wyczyść zrobione (' + done + ')';
  }

  // ---------- Komunikaty ----------
  let toastTimer = null;
  let undoAction = null;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    undoAction = undo || null;
    $('toastUndo').hidden = !undo;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; undoAction = null; }, undo ? 5000 : 3500);
  }
  $('toastUndo').addEventListener('click', () => {
    const fn = undoAction;
    $('toast').hidden = true; undoAction = null;
    if (fn) fn();
  });

  // ---------- Akcje ----------
  const input = $('newTask');

  function openSheet() {
    input.value = '';
    $('sheetAdd').disabled = true;
    $('sheet').hidden = false;
    input.focus(); // od razu w tym samym dotknięciu — wtedy iPhone pokazuje klawiaturę
  }
  function closeSheet() {
    input.blur();
    $('sheet').hidden = true;
  }

  $('addBtn').addEventListener('click', openSheet);
  $('sheetCancel').addEventListener('click', closeSheet);
  $('sheetBackdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('sheet').hidden) closeSheet();
  });
  input.addEventListener('input', () => { $('sheetAdd').disabled = !input.value.trim(); });

  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (filter === 'done') { filter = 'active'; lsSet(LS_FILTER, filter); }
    addTask({ id: newId(), text: text, done: false, createdAt: Date.now(), order: topOrder() });
    closeSheet();
  });

  $('list').addEventListener('click', (e) => {
    if (Date.now() < suppressClickUntil) return; // klik po zakończonym geście
    const li = e.target.closest('.item');
    if (!li) return;
    const t = tasks.find((x) => x.id === li.dataset.id);
    if (!t) return;
    if (e.target.closest('.check')) {
      setDone(t.id, !t.done);
    }
  });

  // ---------- Gesty: przesunięcie w lewo / w prawo i przeciąganie za ≡ ----------
  const list = $('list');
  let gesture = null;          // trwający gest: 'pending' | 'swipe' | 'drag'
  let suppressClickUntil = 0;
  let animating = false;       // trwa animacja odhaczania

  function shortText(s) { return s.length > 28 ? s.slice(0, 28) + '…' : s; }

  list.addEventListener('pointerdown', (e) => {
    if (gesture || animating) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const li = e.target.closest('.item');
    if (!li) return;
    if (e.target.closest('.grip')) {
      e.preventDefault();
      startDrag(li, e);
    } else {
      gesture = { type: 'pending', li: li, id: e.pointerId, x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener('pointermove', (e) => {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;

    if (g.type === 'pending') {
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        g.type = 'swipe';
        g.row = g.li.querySelector('.row');
        g.width = g.li.offsetWidth;
        try { g.li.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) {
        gesture = null; // to przewijanie listy, nie gest
        return;
      } else {
        return;
      }
    }

    if (g.type === 'swipe') {
      e.preventDefault();
      g.dx = e.clientX - g.x;
      g.row.style.transform = 'translateX(' + g.dx + 'px)';
      g.li.classList.toggle('to-right', g.dx > 0);
      g.li.classList.toggle('armed', Math.abs(g.dx) > g.width * 0.35);
    } else if (g.type === 'drag') {
      e.preventDefault();
      g.clientY = e.clientY;
      dragUpdate();
    }
  }, { passive: false });

  function endGesture(e, cancelled) {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;
    gesture = null;
    if (g.type === 'swipe') {
      suppressClickUntil = Date.now() + 400;
      if (!cancelled && g.li.classList.contains('armed')) completeBySwipe(g);
      else snapBack(g);
    } else if (g.type === 'drag') {
      suppressClickUntil = Date.now() + 400;
      endDrag(g, cancelled);
    }
  }
  window.addEventListener('pointerup', (e) => endGesture(e, false));
  window.addEventListener('pointercancel', (e) => endGesture(e, true));

  function snapBack(g) {
    g.row.style.transition = 'transform .2s ease';
    g.row.style.transform = '';
    g.li.classList.remove('armed');
    setTimeout(() => { g.row.style.transition = ''; g.li.classList.remove('to-right'); }, 220);
  }

  // Gest do końca: zadanie odjeżdża, tło na chwilę świeci (zielone / niebieskie / czerwone), wiersz się zwija.
  // W prawo = zrobione lub przywróć, w lewo = usuń.
  function completeBySwipe(g) {
    const t = tasks.find((x) => x.id === g.li.dataset.id);
    if (!t) { snapBack(g); return; }
    const toRight = g.dx > 0;
    animating = true;
    g.row.style.transition = 'transform .2s ease-out';
    g.row.style.transform = toRight ? 'translateX(100%)' : 'translateX(-100%)';
    setTimeout(() => {
      g.li.style.height = g.li.offsetHeight + 'px';
      g.li.classList.add('collapsing');
      void g.li.offsetHeight;
      g.li.style.height = '0px';
    }, 450);
    setTimeout(() => {
      animating = false;
      if (!toRight) {
        const copy = Object.assign({}, t);
        removeTasks([t.id]);
        toast('Usunięto: „' + shortText(copy.text) + '”', () => addTask(copy));
        return;
      }
      const nowDone = !t.done;
      setDone(t.id, nowDone);
      toast((nowDone ? 'Zrobione: „' : 'Przywrócono: „') + shortText(t.text) + '”', () => setDone(t.id, !nowDone));
    }, 700);
  }

  function startDrag(li, e) {
    const items = Array.from(list.children);
    const from = items.indexOf(li);
    const isDone = li.classList.contains('done');
    // Przeciągać można tylko w obrębie swojej grupy (do zrobienia / zrobione)
    let lo = from, hi = from;
    while (lo > 0 && items[lo - 1].classList.contains('done') === isDone) lo--;
    while (hi < items.length - 1 && items[hi + 1].classList.contains('done') === isDone) hi++;
    const rects = items.map((el) => {
      const r = el.getBoundingClientRect();
      return { top: r.top + window.scrollY, h: r.height };
    });
    gesture = {
      type: 'drag', id: e.pointerId, li: li, items: items, from: from, to: from,
      lo: lo, hi: hi, rects: rects, startY: e.clientY + window.scrollY, clientY: e.clientY
    };
    li.classList.add('dragging');
    items.forEach((el) => { if (el !== li) el.classList.add('shifting'); });
    try { e.target.closest('.grip').setPointerCapture(e.pointerId); } catch (err) {}
    gesture.raf = requestAnimationFrame(autoScroll);
  }

  function dragUpdate() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const r = g.rects, me = r[g.from];
    let dy = g.clientY + window.scrollY - g.startY;
    const minDy = r[g.lo].top - me.top;
    const maxDy = r[g.hi].top + r[g.hi].h - (me.top + me.h);
    dy = Math.max(minDy, Math.min(maxDy, dy));
    g.li.style.transform = 'translateY(' + dy + 'px)';

    // Zadanie zajmuje miejsce sąsiada, gdy jego krawędź minie połowę tego sąsiada
    const top = me.top + dy, bottom = top + me.h;
    let to = g.from;
    for (let i = g.from + 1; i <= g.hi; i++) if (bottom > r[i].top + r[i].h / 2) to = i;
    for (let i = g.from - 1; i >= g.lo; i--) if (top < r[i].top + r[i].h / 2) to = i;
    g.to = to;

    g.items.forEach((el, i) => {
      if (i === g.from) return;
      let shift = 0;
      if (g.from < i && i <= to) shift = -me.h;
      else if (to <= i && i < g.from) shift = me.h;
      el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  }

  // Gdy palec jest przy górnej lub dolnej krawędzi ekranu, lista sama się przewija
  function autoScroll() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const edge = 80;
    let v = 0;
    if (g.clientY < edge) v = -(edge - g.clientY) / 6;
    else if (g.clientY > window.innerHeight - edge) v = (g.clientY - (window.innerHeight - edge)) / 6;
    if (v) { window.scrollBy(0, v); dragUpdate(); }
    g.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(g, cancelled) {
    cancelAnimationFrame(g.raf);
    if (!cancelled && g.to !== g.from) {
      const ids = g.items.slice(g.lo, g.hi + 1).map((el) => el.dataset.id);
      moveTask(ids, g.from - g.lo, g.to - g.lo);
    }
    render();
  }

  $('clearDone').addEventListener('click', () => {
    const doneTasks = tasks.filter((t) => t.done).map((t) => Object.assign({}, t));
    if (!doneTasks.length) return;
    removeTasks(doneTasks.map((t) => t.id));
    toast('Usunięto zrobione: ' + doneTasks.length, () => {
      tasks = tasks.concat(doneTasks); save(); render();
    });
  });

  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    lsSet(LS_FILTER, filter);
    render();
  });

  // ---------- Start ----------
  const savedFilter = lsGet(LS_FILTER);
  if (savedFilter === 'active' || savedFilter === 'done') filter = savedFilter;

  try {
    $('today').textContent = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) {}

  load();
  render();

  // Prośba, by system nie czyścił zapisanych zadań
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  // Działanie offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
