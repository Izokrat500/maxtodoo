<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dodo</title>

<!-- Appka na ekranie początkowym iPhone'a -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dodo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">

<style>
  /* Layout: jedna kolumna jak natywna lista iOS — duży tytuł, przyciski dodawania, przełącznik filtrów, zwijane kategorie na kartach */
  :root {
    --bg: #F2F3F7;
    --card: #FFFFFF;
    --fg: #16181D;
    --muted: #6B7180;
    --line: #E3E5EC;
    --accent: #2B63D9;
    --accent-fg: #FFFFFF;
    --danger: #D93A3A;
    --success: #2E9E5B;
    --hp: #E5484D;
    --coin: #B7791F;
    --done: #9AA0AD;
    --seg-bg: #E4E6ED;
    --seg-on: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 30, 60, .06);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E0F12; --card: #1B1D22; --fg: #F1F2F5; --muted: #9097A3; --line: #2A2D34;
      --accent: #5B8DF5; --accent-fg: #0E0F12; --danger: #F06A6A; --success: #2FA862; --hp: #E5484D; --coin: #F2C14E; --done: #6A707C;
      --seg-bg: #23262C; --seg-on: #3A3E47; --shadow: none;
      color-scheme: dark;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); color: var(--fg); }
  body { margin: 0; font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 120px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 8px; }
  .head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  /* Profil gracza: awatar, pasek życia i monety */
  .profile { flex: none; width: 150px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--card), 0 2px 8px rgba(22, 30, 60, .18); }
  .avatar img { display: block; width: 100%; height: 100%; }
  .stat { width: 100%; display: flex; align-items: center; gap: 6px; }
  .stat-icon { flex: none; width: 20px; height: 20px; }
  .hp-bar { position: relative; flex: 1; height: 12px; border-radius: 8px; background: var(--seg-bg); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .12); }
  .hp-fill { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 8px; background: linear-gradient(180deg, #FF7A7F, var(--hp)); transition: width .5s ease, background .3s; }
  .hp-fill::after { content: ""; position: absolute; left: 4px; right: 4px; top: 2px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .35); }
  .hp-bar.low .hp-fill { background: linear-gradient(180deg, #FFB25C, #E8781C); }
  .hp-bar.critical .hp-fill { background: linear-gradient(180deg, #FF5A5F, #B4232A); animation: pulse 1.2s ease-in-out infinite; }
  .hp-text { flex: none; min-width: 34px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .coins { flex: 1; text-align: right; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bump { animation: bump .45s ease; }
  @keyframes pulse { 50% { opacity: .65; } }
  @keyframes bump { 40% { transform: scale(1.25); } }
  .date { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  h1 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .count { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  .add-btn { width: 100%; height: 52px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; box-shadow: var(--shadow); transition: opacity .15s; }
  .add-btn:active { opacity: .8; }
  .add-btn svg { width: 26px; height: 26px; }
  .cat-btn { width: 100%; height: 44px; border-radius: 14px; background: var(--card); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600; box-shadow: var(--shadow); }
  .cat-btn svg { width: 18px; height: 18px; }
  .cat-btn:active { opacity: .7; }

  /* Okienko (nowe zadanie / edycja / kategoria) — u góry ekranu, żeby klawiatura go nie zasłaniała */
  .sheet {
    position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; align-items: flex-start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 72px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 12, 18, .45); animation: fade .15s ease-out; }
  .sheet-card { position: relative; width: 100%; max-width: 528px; display: flex; flex-direction: column; gap: 8px; padding: 6px 8px 16px; background: var(--card); border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); animation: pop .18s ease-out; }
  .sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .sheet-title { margin: 0; font-weight: 600; }
  .sheet-btn { justify-self: start; height: 44px; padding: 0 8px; color: var(--accent); font-size: 17px; }
  .sheet-btn.strong { justify-self: end; font-weight: 600; }
  .sheet-btn:disabled { opacity: .35; cursor: default; }
  .sheet-card input { height: 48px; margin-inline: 8px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--seg-bg); color: var(--fg); font: inherit; font-size: 17px; outline: none; }
  .sheet-card input::placeholder { color: var(--muted); }
  .chips-label { margin: 6px 16px 0; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-inline: 8px; }
  .chip { height: 36px; max-width: 100%; padding: 0 14px; border-radius: 18px; background: var(--seg-bg); color: var(--fg); font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }

  /* Menu opcji kategorii — od dołu, jak w iOS */
  .menu {
    position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .menu-card { position: relative; width: 100%; max-width: 528px; display: flex; flex-direction: column; gap: 8px; animation: rise .2s ease-out; }
  .menu-group { display: flex; flex-direction: column; background: var(--card); border-radius: 14px; overflow: hidden; }
  .menu-title { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; overflow-wrap: anywhere; }
  .menu-btn { height: 56px; color: var(--accent); font-size: 18px; }
  .menu-btn + .menu-btn { border-top: 1px solid var(--line); }
  .menu-btn.danger { color: var(--danger); }
  .menu-btn.strong { font-weight: 600; }

  /* Okienko „Nowy dzień!” z rozliczeniem codziennych */
  .summary {
    position: fixed; inset: 0; z-index: 26; display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .summary-card { position: relative; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 20px 16px; background: var(--card); border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); text-align: center; animation: pop .22s ease-out; }
  .summary-card img { width: 72px; height: 72px; border-radius: 18px; }
  .summary-title { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; }
  .summary-text { margin: 0; color: var(--muted); font-size: 15px; text-wrap: balance; }
  .summary-gains { display: flex; gap: 10px; margin: 4px 0; }
  .gain { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--seg-bg); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .gain svg { width: 22px; height: 22px; }
  .summary-ok { width: 100%; height: 48px; margin-top: 6px; border-radius: 12px; background: var(--accent); color: var(--accent-fg); font-size: 17px; font-weight: 600; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--seg-bg); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { height: 34px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
  .seg button[aria-selected="true"] { background: var(--seg-on); color: var(--fg); box-shadow: var(--shadow); }

  /* Listy: zadania bez kategorii na górze, potem zwijane kategorie */
  .lists { display: flex; flex-direction: column; gap: 20px; }
  .cat { display: flex; flex-direction: column; gap: 6px; }
  .cat-head { display: flex; align-items: center; gap: 2px; }
  .cat-toggle { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 2px; text-align: left; }
  .cat-toggle svg { flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform .18s ease; }
  .cat.collapsed .cat-toggle svg { transform: rotate(-90deg); }
  .cat-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .cat-count { flex: none; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--seg-bg); color: var(--muted); font-size: 13px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .cat-add, .cat-more { flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: var(--accent); border-radius: 10px; }
  .cat-add svg, .cat-more svg { width: 22px; height: 22px; }

  .list { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .empty-row { padding: 14px 16px; color: var(--muted); font-size: 15px; }
  .item { position: relative; background: var(--card); }

  /* Tło odsłaniane gestem: w prawo = zrobione (zielone) / przywróć (niebieskie), w lewo = usuń (czerwone) */
  .swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-inline: 20px; background: var(--danger); color: #FFFFFF; font-size: 15px; font-weight: 600; }
  .item.to-right .swipe-bg { background: var(--success); justify-content: flex-start; }
  .item.done.to-right .swipe-bg { background: var(--accent); }
  .swipe-label { display: flex; align-items: center; gap: 6px; opacity: .6; transform: scale(.92); transition: opacity .12s, transform .12s; }
  /* W lewo widać tylko „Usuń”, w prawo tylko „Zrobione” / „Przywróć” */
  .swipe-label.act-label, .item.to-right .swipe-label.del-label { display: none; }
  .item.to-right .swipe-label.act-label { display: flex; }
  .swipe-label svg { width: 20px; height: 20px; }
  .item.armed .swipe-label { opacity: 1; transform: none; }

  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 2px; min-height: 52px; padding-left: 16px; background: var(--card); touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .item + .item .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 1px solid var(--line); }

  /* Przeciąganie */
  .item.dragging { z-index: 5; box-shadow: 0 10px 28px rgba(0, 0, 0, .2); }
  .item.dragging .row::before { display: none; }
  .item.shifting { transition: transform .18s ease; }
  .item.collapsing { overflow: hidden; transition: height .22s ease; }
  .grip { flex: none; width: 40px; height: 48px; display: grid; place-items: center; color: var(--done); touch-action: none; cursor: grab; }
  .grip svg { width: 20px; height: 20px; }
  .item.dragging .grip { color: var(--fg); cursor: grabbing; }

  .hint { margin: -6px 0 0; color: var(--muted); font-size: 13px; text-align: center; text-wrap: balance; }
  /* Zielony ptaszek przy zrobionych — tylko znaczek, nie da się go kliknąć */
  .status { flex: none; width: 24px; height: 24px; margin-right: 10px; border-radius: 50%; background: var(--success); color: #FFFFFF; display: grid; place-items: center; }
  .status svg { width: 14px; height: 14px; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding-block: 13px; overflow-wrap: anywhere; cursor: pointer; }
  .meta { color: var(--muted); font-size: 13px; }

  .empty { text-align: center; padding: 36px 16px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .empty-title { margin: 0; font-weight: 600; }
  .empty-sub { margin: 0; color: var(--muted); font-size: 15px; }

  .clear { align-self: center; height: 44px; padding: 0 16px; color: var(--accent); font-size: 15px; font-weight: 600; }

  .toast {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; pointer-events: none;
  }
  .toast-inner { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 528px; width: 100%; background: var(--fg); color: var(--bg); border-radius: 14px; padding: 6px 6px 6px 16px; min-height: 52px; box-shadow: 0 6px 24px rgba(0,0,0,.18); animation: rise .2s ease-out; }
  .toast-msg { flex: 1; min-width: 0; font-size: 15px; }
  .toast-undo { height: 40px; padding: 0 14px; border-radius: 10px; color: var(--bg); font-weight: 700; font-size: 15px; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<main class="app">
  <header>
    <div class="head-text">
      <p class="date" id="today"></p>
      <h1>Zadania</h1>
      <p class="count" id="count">&nbsp;</p>
    </div>
    <div class="profile" aria-label="Twój profil">
      <div class="avatar"><img src="icons/icon-180.png" alt="Twój dodo"></div>
      <div class="stat" title="Życie">
        <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21.2 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.2z" fill="#E5484D" stroke="#9E1F25" stroke-width="1.4"/>
          <path d="M7.2 6.2c-1.3.3-2.2 1.4-2.3 2.7" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="hp-bar" id="hpBar" role="meter" aria-label="Życie" aria-valuemin="0" aria-valuemax="50">
          <div class="hp-fill" id="hpFill"></div>
        </div>
        <span class="hp-text" id="hpText">50/50</span>
      </div>
      <div class="stat" title="Monety">
        <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#F5B301" stroke="#9A6A00" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="6.8" fill="#FFD84D" stroke="#C98F00" stroke-width="1.2"/>
          <path d="M10.2 9h2.3a3 3 0 010 6h-2.3z" fill="none" stroke="#9A6A00" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M6.6 8.4a6.3 6.3 0 012.6-2.4" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="coins" id="coins">0</span>
      </div>
    </div>
  </header>

  <div class="actions">
    <button class="add-btn" id="addBtn" type="button" aria-label="Dodaj zadanie" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="cat-btn" id="newCatBtn" type="button" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nowa kategoria
    </button>
  </div>

  <div class="seg" role="tablist" aria-label="Pokaż">
    <button id="f-active" role="tab" data-filter="active" aria-selected="true">Do zrobienia</button>
    <button id="f-done" role="tab" data-filter="done" aria-selected="false">Zrobione</button>
    <button id="f-daily" role="tab" data-filter="daily" aria-selected="false">Codzienne</button>
  </div>

  <div class="lists" id="lists"></div>
  <p class="hint" id="hint" hidden></p>

  <div class="empty" id="empty">
    <p class="empty-title" id="emptyTitle"></p>
    <p class="empty-sub" id="emptySub"></p>
  </div>

  <button class="clear" id="clearDone" hidden></button>
</main>

<!-- Okienko: nowe zadanie / edycja zadania / nowa kategoria / zmiana nazwy -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <form class="sheet-card" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" autocomplete="off">
    <div class="sheet-head">
      <button class="sheet-btn" id="sheetCancel" type="button">Anuluj</button>
      <p class="sheet-title" id="sheetTitle">Nowe zadanie</p>
      <button class="sheet-btn strong" id="sheetOk" type="submit" disabled>Dodaj</button>
    </div>
    <input id="sheetInput" type="text" maxlength="200" enterkeyhint="done" aria-label="Treść">
    <p class="chips-label" id="chipsLabel">Kategoria</p>
    <div class="chips" id="chips" role="group" aria-labelledby="chipsLabel"></div>
  </form>
</div>

<!-- Menu opcji kategorii -->
<div class="menu" id="menu" hidden>
  <div class="sheet-backdrop" id="menuBackdrop"></div>
  <div class="menu-card" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="menu-group">
      <p class="menu-title" id="menuTitle"></p>
      <button class="menu-btn" id="menuRename" type="button">Zmień nazwę</button>
      <button class="menu-btn danger" id="menuDelete" type="button"></button>
    </div>
    <div class="menu-group">
      <button class="menu-btn strong" id="menuCancel" type="button">Anuluj</button>
    </div>
  </div>
</div>

<!-- Podsumowanie po północy -->
<div class="summary" id="summary" hidden>
  <div class="sheet-backdrop"></div>
  <div class="summary-card" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
    <img src="icons/icon-180.png" alt="">
    <p class="summary-title" id="summaryTitle">Nowy dzień!</p>
    <p class="summary-text" id="summaryText"></p>
    <div class="summary-gains" id="summaryGains"></div>
    <button class="summary-ok" id="summaryOk" type="button">Do dzieła!</button>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <div class="toast-inner">
    <span class="toast-msg" id="toastMsg"></span>
    <button class="toast-undo" id="toastUndo" hidden>Cofnij</button>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const LS_TASKS = 'zadania-v1';
  const LS_CATS = 'dodo-kategorie';
  const LS_FILTER = 'zadania-filtr';
  const LS_DAILY = 'dodo-codzienne';
  const LS_DAILY_FOLD = 'dodo-codzienne-zwiniete';
  const LS_GAME = 'dodo-gra';

  // Grywalizacja: monety od razu przy odhaczeniu (codzienne +1, z listy „Do zrobienia” +2),
  // a po północy za każde niezrobione codzienne −1 HP
  const MAX_HP = 50;
  const COINS_DAILY = 1;
  const COINS_TASK = 2;
  const HP_PER_MISS = 1;
  let game = { hp: MAX_HP, coins: 0, settled: null }; // settled = ostatni rozliczony dzień

  let tasks = [];
  let cats = [];   // kategorie w kolejności tworzenia: { id, name, collapsed }
  let dailies = []; // zadania codzienne: { id, text, order, doneDate } — zrobione, gdy doneDate to dzisiejsza data
  let dailyDoneCollapsed = true;
  let filter = 'active';

  // Dzisiejsza data jako 'RRRR-MM-DD' (czas lokalny telefonu). Nowy dzień = codzienne wracają same.
  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function doneToday(d) { return d.doneDate === today(); }
  // Przesunięcie daty 'RRRR-MM-DD' o n dni
  function shiftDay(s, n) {
    const [y, m, d] = s.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function newId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function clean(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      text: String((raw && raw.text) || '').slice(0, 200),
      done: !!(raw && raw.done),
      createdAt: Number(raw && raw.createdAt) || 0,
      order: Number.isFinite(Number(raw && raw.order)) && raw.order !== null && raw.order !== '' ? Number(raw.order) : null,
      cat: raw && raw.cat ? String(raw.cat) : null
    };
  }
  function cleanDaily(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      text: String((raw && raw.text) || '').slice(0, 200),
      order: Number(raw && raw.order) || 0,
      doneDate: raw && raw.doneDate ? String(raw.doneDate) : null,
      // Od tego dnia zadanie liczy się do rozliczenia (starsze zapisy: od dziś)
      createdDate: raw && raw.createdDate ? String(raw.createdDate) : today()
    };
  }
  function cleanCat(raw) {
    return {
      id: String((raw && raw.id) || newId()),
      name: String((raw && raw.name) || '').slice(0, 40),
      collapsed: !!(raw && raw.collapsed)
    };
  }

  // Kolejność na liście: mniejsza liczba = wyżej. Niezrobione zawsze nad zrobionymi.
  function byOrder(a, b) { return (a.done - b.done) || (a.order - b.order); }
  function topOrder() {
    return tasks.reduce((m, t) => Math.min(m, t.order), 0) - 1;
  }
  function catById(id) { return cats.find((c) => c.id === id) || null; }
  function shortText(s) { return s.length > 28 ? s.slice(0, 28) + '…' : s; }
  function zadan(n) {
    const last = n % 10, last2 = n % 100;
    if (n === 1) return '1 zadanie';
    if (last >= 2 && last <= 4 && (last2 < 12 || last2 > 14)) return n + ' zadania';
    return n + ' zadań';
  }

  // ---------- Zapis w pamięci telefonu ----------
  function load() {
    let list = [];
    try { list = JSON.parse(lsGet(LS_CATS)) || []; } catch (e) {}
    cats = Array.isArray(list) ? list.map(cleanCat).filter((c) => c.name) : [];

    list = [];
    try { list = JSON.parse(lsGet(LS_TASKS)) || []; } catch (e) {}
    tasks = Array.isArray(list) ? list.map(clean).filter((t) => t.text) : [];
    // Zadanie z nieistniejącą kategorią trafia do „bez kategorii”
    tasks.forEach((t) => { if (t.cat && !catById(t.cat)) t.cat = null; });

    list = [];
    try { list = JSON.parse(lsGet(LS_DAILY)) || []; } catch (e) {}
    dailies = Array.isArray(list) ? list.map(cleanDaily).filter((d) => d.text) : [];
    dailyDoneCollapsed = lsGet(LS_DAILY_FOLD) !== '0';
    saveDaily(); // zapisuje createdDate starszym zadaniom

    let g = null;
    try { g = JSON.parse(lsGet(LS_GAME)); } catch (e) {}
    game = {
      hp: g && Number.isFinite(g.hp) ? Math.max(0, Math.min(MAX_HP, g.hp)) : MAX_HP,
      coins: g && Number.isFinite(g.coins) ? Math.max(0, g.coins) : 0,
      // Pierwsze uruchomienie: nic wstecz, pierwszym rozliczanym dniem będzie dzisiaj
      settled: g && g.settled ? String(g.settled) : shiftDay(today(), -1)
    };
    saveGame();
    // Starsze zapisy nie miały kolejności — nadaj ją wg dotychczasowego układu (najnowsze na górze)
    if (tasks.some((t) => t.order === null)) {
      tasks.sort((a, b) => (a.done - b.done) || (b.createdAt - a.createdAt));
      tasks.forEach((t, i) => { t.order = i; });
      save();
    }
  }
  function save() {
    if (!lsSet(LS_TASKS, JSON.stringify(tasks))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }
  function saveCats() {
    if (!lsSet(LS_CATS, JSON.stringify(cats))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }

  function saveDaily() {
    if (!lsSet(LS_DAILY, JSON.stringify(dailies))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }
  function saveGame() {
    if (!lsSet(LS_GAME, JSON.stringify(game))) {
      toast('Nie udało się zapisać zmian w pamięci telefonu.');
    }
  }

  // Rozlicza wszystkie zakończone dni od ostatniego rozliczenia do wczoraj.
  // Zadanie liczy się jako zrobione danego dnia, gdy jego doneDate to ten dzień.
  function settleDays() {
    const t = today();
    let day = shiftDay(game.settled, 1);
    const result = { days: 0, done: 0, total: 0, hp: 0, lastDay: null };
    while (day < t) {
      for (const d of dailies) {
        if (d.createdDate > day) continue; // zadania jeszcze nie było
        result.total++;
        if (d.doneDate === day) result.done++;
      }
      result.days++;
      result.lastDay = day;
      day = shiftDay(day, 1);
    }
    if (!result.days) return null;

    const missed = result.total - result.done;
    const hpBefore = game.hp;
    game.hp = Math.max(0, game.hp - missed * HP_PER_MISS);
    game.settled = shiftDay(t, -1);
    saveGame();
    result.hp = game.hp - hpBefore;
    return result;
  }

  const ICON_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.2z" fill="#E5484D" stroke="#9E1F25" stroke-width="1.4"/></svg>';

  function showSummary(r) {
    const missed = r.total - r.done;
    let text;
    if (r.total === 0) {
      text = 'Nie miałeś jeszcze codziennych zadań. Dodaj je w zakładce „Codzienne”, żeby zbierać monety.';
    } else if (r.days === 1) {
      text = 'Wczoraj zrobiłeś ' + r.done + ' z ' + r.total + ' codziennych zadań.'
        + (missed === 0 ? ' Komplet, brawo!' : '');
    } else {
      const few = r.days % 10 >= 2 && r.days % 10 <= 4 && (r.days % 100 < 12 || r.days % 100 > 14);
      text = 'Od ostatniej wizyty ' + (few ? 'minęły ' : 'minęło ') + r.days + ' dni. Zrobione: ' + r.done + ', pominięte: ' + missed + '.';
    }
    if (game.hp === 0) text += ' Twój dodo nie ma już życia!';
    $('summaryText').textContent = text;
    $('summaryGains').innerHTML =
      '<span class="gain">' + ICON_HEART + (r.hp < 0 ? '−' + Math.abs(r.hp) + ' HP' : 'bez strat') + '</span>';
    $('summary').hidden = false;
  }
  $('summaryOk').addEventListener('click', () => {
    $('summary').hidden = true;
    renderProfile(true);
  });

  function renderProfile(animate) {
    const pct = Math.round((game.hp / MAX_HP) * 100);
    $('hpFill').style.width = pct + '%';
    $('hpText').textContent = game.hp + '/' + MAX_HP;
    $('hpBar').setAttribute('aria-valuenow', String(game.hp));
    $('hpBar').classList.toggle('low', game.hp <= MAX_HP * 0.5 && game.hp > MAX_HP * 0.2);
    $('hpBar').classList.toggle('critical', game.hp <= MAX_HP * 0.2);
    $('coins').textContent = game.coins;
    if (animate) {
      for (const el of [$('coins'), $('hpBar')]) {
        el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      }
    }
  }

  function addDaily(d) { dailies.push(d); saveDaily(); render(); }
  // Monety przyznawane od razu; cofnięcie odhaczenia je zabiera (żeby nie dało się ich nabijać)
  function addCoins(n) {
    game.coins = Math.max(0, game.coins + n);
    saveGame();
    renderProfile(true);
  }
  function monet(n) {
    n = Math.abs(n);
    const last = n % 10, last2 = n % 100;
    if (n === 1) return '1 moneta';
    if (last >= 2 && last <= 4 && (last2 < 12 || last2 > 14)) return n + ' monety';
    return n + ' monet';
  }

  function setDailyDone(id, done) {
    const d = dailies.find((x) => x.id === id);
    if (!d) return;
    if (doneToday(d) !== done) addCoins(done ? COINS_DAILY : -COINS_DAILY);
    d.doneDate = done ? today() : null; saveDaily(); render();
  }
  function removeDaily(id) {
    dailies = dailies.filter((x) => x.id !== id); saveDaily(); render();
  }

  function addTask(t) { tasks.push(t); save(); render(); }
  function setDone(id, done) {
    const t = tasks.find((x) => x.id === id);
    // Zadanie trafia na górę swojej grupy (świeżo zrobione — na górę zrobionych)
    if (!t) return;
    if (t.done !== done) addCoins(done ? COINS_TASK : -COINS_TASK);
    t.done = done; t.order = topOrder(); save(); render();
  }
  function moveItems(arr, ids, from, to) {
    // ids: elementy jednej listy w obecnej kolejności; przenosimy pozycję from → to
    const group = ids.map((id) => arr.find((t) => t.id === id)).filter(Boolean);
    const slots = group.map((t) => t.order).sort((a, b) => a - b);
    const [moved] = group.splice(from, 1);
    group.splice(to, 0, moved);
    group.forEach((t, i) => { t.order = slots[i]; });
  }
  function removeTasks(ids) {
    tasks = tasks.filter((x) => !ids.includes(x.id)); save(); render();
  }

  // ---------- Widok ----------
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ICON_GRIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>';
  const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const ICON_MORE = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
  const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const LABEL_DONE = '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Zrobione</span>';
  const LABEL_RESTORE = '<span class="swipe-label act-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Przywróć</span>';
  const LABEL_DELETE = '<span class="swipe-label del-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>Usuń</span>';

  // kind: 'task' (zwykłe zadanie) albo 'daily' (codzienne — „zrobione” znaczy zrobione dzisiaj)
  function buildItem(t, showCat, kind) {
    const done = kind === 'daily' ? doneToday(t) : t.done;
    const li = document.createElement('li');
    li.className = 'item' + (done ? ' done' : '');
    li.dataset.id = t.id;
    li.dataset.kind = kind || 'task';


    const text = document.createElement('span');
    text.className = 'text';
    const main = document.createElement('span');
    main.textContent = t.text;
    text.append(main);
    const c = showCat && t.cat ? catById(t.cat) : null;
    if (c) {
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = c.name;
      text.append(meta);
    }

    const grip = document.createElement('button');
    grip.className = 'grip';
    grip.type = 'button';
    grip.setAttribute('aria-label', 'Przeciągnij, aby zmienić kolejność');
    grip.innerHTML = ICON_GRIP;

    const bg = document.createElement('div');
    bg.className = 'swipe-bg';
    bg.setAttribute('aria-hidden', 'true');
    bg.innerHTML = (done ? LABEL_RESTORE : LABEL_DONE) + LABEL_DELETE;

    const row = document.createElement('div');
    row.className = 'row';
    if (done) {
      const status = document.createElement('span');
      status.className = 'status';
      status.setAttribute('aria-label', 'Zrobione');
      status.innerHTML = ICON_CHECK;
      row.append(status);
    }
    row.append(text, grip);
    li.append(bg, row);
    return li;
  }

  function buildList(items, showCat, emptyText, kind) {
    const ul = document.createElement('ul');
    ul.className = 'list';
    for (const t of items) ul.append(buildItem(t, showCat, kind));
    if (!items.length && emptyText) {
      const li = document.createElement('li');
      li.className = 'empty-row';
      li.textContent = emptyText;
      ul.append(li);
    }
    return ul;
  }

  function buildCategory(c, items) {
    const sec = document.createElement('section');
    sec.className = 'cat' + (c.collapsed ? ' collapsed' : '');
    sec.dataset.cat = c.id;

    const head = document.createElement('div');
    head.className = 'cat-head';

    const toggle = document.createElement('button');
    toggle.className = 'cat-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(!c.collapsed));
    toggle.innerHTML = ICON_CHEVRON;
    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = c.name;
    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = items.length;
    toggle.append(name, count);

    const add = document.createElement('button');
    add.className = 'cat-add';
    add.type = 'button';
    add.setAttribute('aria-label', 'Dodaj zadanie do: ' + c.name);
    add.innerHTML = ICON_PLUS;

    const more = document.createElement('button');
    more.className = 'cat-more';
    more.type = 'button';
    more.setAttribute('aria-label', 'Opcje kategorii ' + c.name);
    more.innerHTML = ICON_MORE;

    head.append(toggle, add, more);
    sec.append(head);
    if (!c.collapsed) sec.append(buildList(items, false, 'Brak zadań. Dotknij +, aby dodać.'));
    return sec;
  }

  // Sekcja „Zrobione dziś” w zakładce Codzienne — zwijana jak kategoria, bez + i ⋯
  function buildDailyDone(items) {
    const sec = document.createElement('section');
    sec.className = 'cat' + (dailyDoneCollapsed ? ' collapsed' : '');
    sec.dataset.section = 'dailydone';
    const head = document.createElement('div');
    head.className = 'cat-head';
    const toggle = document.createElement('button');
    toggle.className = 'cat-toggle';
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(!dailyDoneCollapsed));
    toggle.innerHTML = ICON_CHEVRON;
    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = 'Zrobione dziś';
    const count = document.createElement('span');
    count.className = 'cat-count';
    count.textContent = items.length;
    toggle.append(name, count);
    head.append(toggle);
    sec.append(head);
    if (!dailyDoneCollapsed) sec.append(buildList(items, false, '', 'daily'));
    return sec;
  }

  function render() {
    const activeCount = tasks.filter((t) => !t.done).length;
    const doneCount = tasks.length - activeCount;
    const dailyDoneCount = dailies.filter(doneToday).length;

    if (filter === 'daily') {
      $('count').textContent = dailies.length === 0 ? 'Brak codziennych zadań'
        : 'Dziś zrobione: ' + dailyDoneCount + ' z ' + dailies.length;
    } else {
      $('count').textContent = tasks.length === 0 ? 'Brak zadań'
        : 'Do zrobienia: ' + activeCount + (doneCount ? ' · zrobione: ' + doneCount : '');
    }
    $('newCatBtn').hidden = filter === 'daily';

    document.querySelectorAll('.seg button').forEach((b) => {
      b.setAttribute('aria-selected', String(b.dataset.filter === filter));
    });

    const sorted = tasks.slice().sort(byOrder);
    const lists = $('lists');
    lists.textContent = '';

    let shownCount;
    if (filter === 'daily') {
      const all = dailies.slice().sort((a, b) => a.order - b.order);
      const todo = all.filter((d) => !doneToday(d));
      const doneNow = all.filter(doneToday);
      shownCount = all.length;
      if (todo.length) lists.append(buildList(todo, false, '', 'daily'));
      else if (all.length) lists.append(buildList([], false, 'Wszystko na dziś zrobione! Jutro rano zadania wrócą.'));
      if (doneNow.length) lists.append(buildDailyDone(doneNow));
      lists.hidden = !lists.children.length;

      $('hint').hidden = all.length === 0;
      $('hint').textContent = 'W prawo — zrobione na dziś. W lewo — usuń na stałe. Jutro rano wszystko wróci do zrobienia.';
      $('empty').hidden = all.length > 0;
      $('emptyTitle').textContent = 'Brak codziennych zadań';
      $('emptySub').textContent = 'Dodaj niebieskim + to, co robisz każdego dnia, np. „Umyć zęby rano”. Każdego ranka wróci na listę.';
      $('clearDone').hidden = true;
      return;
    }

    if (filter === 'done') {
      const done = sorted.filter((t) => t.done);
      shownCount = done.length;
      if (done.length) lists.append(buildList(done, true));
    } else {
      const active = sorted.filter((t) => !t.done);
      shownCount = active.length;
      const loose = active.filter((t) => !t.cat);
      if (loose.length) lists.append(buildList(loose, false));
      for (const c of cats) lists.append(buildCategory(c, active.filter((t) => t.cat === c.id)));
    }
    lists.hidden = !lists.children.length;

    $('hint').hidden = shownCount === 0;
    $('hint').textContent = (filter === 'done'
      ? 'W prawo — przywróć. W lewo — usuń.'
      : 'W prawo — zrobione. W lewo — usuń.')
      + ' Dotknij zadania, aby je zmienić lub przenieść. Przeciągnij za ≡, aby zmienić kolejność.';

    // Pusty stan: gdy nie ma czego pokazać (kategorie liczą się jako treść)
    const nothing = filter === 'done' ? doneCount === 0 : activeCount === 0 && cats.length === 0;
    $('empty').hidden = !nothing;
    if (tasks.length === 0 && cats.length === 0) {
      $('emptyTitle').textContent = 'Lista jest pusta';
      $('emptySub').textContent = 'Dotknij niebieskiego przycisku +, aby dodać pierwsze zadanie.';
    } else if (filter === 'active') {
      $('emptyTitle').textContent = 'Wszystko zrobione!';
      $('emptySub').textContent = 'Nic na Ciebie nie czeka.';
    } else {
      $('emptyTitle').textContent = 'Nic jeszcze nie odhaczono';
      $('emptySub').textContent = 'Przesuń zadanie w prawo, gdy je skończysz.';
    }

    const clear = $('clearDone');
    clear.hidden = doneCount === 0 || filter !== 'done';
    clear.textContent = 'Wyczyść zrobione (' + doneCount + ')';
  }

  // ---------- Komunikaty ----------
  let toastTimer = null;
  let undoAction = null;
  function toast(msg, undo) {
    $('toastMsg').textContent = msg;
    undoAction = undo || null;
    $('toastUndo').hidden = !undo;
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $('toast').hidden = true; undoAction = null; }, undo ? 5000 : 3500);
  }
  $('toastUndo').addEventListener('click', () => {
    const fn = undoAction;
    $('toast').hidden = true; undoAction = null;
    if (fn) fn();
  });

  // ---------- Okienko ----------
  // mode: 'add' (nowe zadanie), 'edit' (zmiana zadania), 'newcat' (nowa kategoria), 'renamecat' (zmiana nazwy)
  const input = $('sheetInput');
  let sheet = null;          // { mode, taskId, catId }
  let pickedCat = null;      // kategoria zaznaczona w okienku zadania

  function renderChips() {
    const box = $('chips');
    box.textContent = '';
    const options = [{ id: null, name: 'Bez kategorii' }].concat(cats);
    for (const c of options) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.dataset.cat = c.id || '';
      b.setAttribute('aria-pressed', String(c.id === pickedCat));
      b.textContent = c.name;
      box.append(b);
    }
  }

  function openSheet(opts) {
    sheet = opts;
    // Dodatkowe tryby: 'adddaily' / 'editdaily' — zadanie codzienne (bez kategorii)
    const isTask = opts.mode === 'add' || opts.mode === 'edit';
    const isDaily = opts.mode === 'adddaily' || opts.mode === 'editdaily';
    const t = opts.mode === 'edit' ? tasks.find((x) => x.id === opts.taskId)
      : opts.mode === 'editdaily' ? dailies.find((x) => x.id === opts.taskId) : null;
    const c = opts.mode === 'renamecat' ? catById(opts.catId) : null;

    $('sheetTitle').textContent = {
      add: 'Nowe zadanie', edit: 'Zadanie', newcat: 'Nowa kategoria', renamecat: 'Zmień nazwę',
      adddaily: 'Codzienne zadanie', editdaily: 'Codzienne zadanie'
    }[opts.mode];
    $('sheetOk').textContent = ['add', 'newcat', 'adddaily'].includes(opts.mode) ? 'Dodaj' : 'Zapisz';
    input.placeholder = isDaily ? 'Co robisz codziennie? np. Umyć zęby rano'
      : isTask ? 'Co masz do zrobienia?' : 'Nazwa, np. Sport albo Praca';
    input.maxLength = isTask || isDaily ? 200 : 40;
    input.value = t ? t.text : c ? c.name : '';
    $('sheetOk').disabled = !input.value.trim();

    pickedCat = opts.mode === 'edit' && t ? t.cat : (opts.catId && isTask ? opts.catId : null);
    const showChips = isTask && cats.length > 0;
    $('chipsLabel').hidden = !showChips;
    $('chips').hidden = !showChips;
    if (showChips) renderChips();

    $('sheet').hidden = false;
    // Klawiatura od razu przy dodawaniu; przy zmianie zadania nie, żeby łatwo wybrać kategorię
    if (opts.mode !== 'edit') input.focus();
  }
  function closeSheet() {
    input.blur();
    $('sheet').hidden = true;
    sheet = null;
  }

  $('addBtn').addEventListener('click', () => openSheet({ mode: filter === 'daily' ? 'adddaily' : 'add' }));
  $('newCatBtn').addEventListener('click', () => openSheet({ mode: 'newcat' }));
  $('sheetCancel').addEventListener('click', closeSheet);
  $('sheetBackdrop').addEventListener('click', closeSheet);
  input.addEventListener('input', () => { $('sheetOk').disabled = !input.value.trim(); });

  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    pickedCat = b.dataset.cat || null;
    $('chips').querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });

  $('sheetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !sheet) return;

    if (sheet.mode === 'add') {
      if (filter === 'done') { filter = 'active'; lsSet(LS_FILTER, filter); }
      const c = catById(pickedCat);
      if (c && c.collapsed) { c.collapsed = false; saveCats(); }
      addTask({ id: newId(), text: text, done: false, createdAt: Date.now(), order: topOrder(), cat: c ? c.id : null });
    } else if (sheet.mode === 'edit') {
      const t = tasks.find((x) => x.id === sheet.taskId);
      if (t) {
        const moved = t.cat !== pickedCat;
        t.text = text;
        t.cat = pickedCat;
        if (moved) {
          t.order = topOrder(); // w nowej kategorii ląduje na górze
          const c = catById(pickedCat);
          if (c && c.collapsed) { c.collapsed = false; saveCats(); }
        }
        save(); render();
        if (moved) toast('Przeniesiono do: ' + (catById(pickedCat) ? catById(pickedCat).name : 'Bez kategorii'));
      }
    } else if (sheet.mode === 'newcat') {
      if (filter === 'done') { filter = 'active'; lsSet(LS_FILTER, filter); }
      cats.push({ id: newId(), name: text, collapsed: false });
      saveCats(); render();
    } else if (sheet.mode === 'renamecat') {
      const c = catById(sheet.catId);
      if (c) { c.name = text; saveCats(); render(); }
    } else if (sheet.mode === 'adddaily') {
      // Nowe codzienne trafia na koniec listy — kolejność dnia ustawiasz przeciąganiem
      const last = dailies.reduce((m, d) => Math.max(m, d.order), 0);
      addDaily({ id: newId(), text: text, order: last + 1, doneDate: null, createdDate: today() });
    } else if (sheet.mode === 'editdaily') {
      const d = dailies.find((x) => x.id === sheet.taskId);
      if (d) { d.text = text; saveDaily(); render(); }
    }
    closeSheet();
  });

  // ---------- Menu kategorii ----------
  let menuCat = null;
  function openMenu(catId) {
    const c = catById(catId);
    if (!c) return;
    menuCat = c.id;
    const n = tasks.filter((t) => t.cat === c.id).length;
    $('menuTitle').textContent = c.name;
    $('menuDelete').textContent = n ? 'Usuń kategorię i ' + zadan(n) : 'Usuń kategorię';
    $('menu').hidden = false;
  }
  function closeMenu() { $('menu').hidden = true; menuCat = null; }

  $('menuCancel').addEventListener('click', closeMenu);
  $('menuBackdrop').addEventListener('click', closeMenu);
  $('menuRename').addEventListener('click', () => {
    const id = menuCat;
    closeMenu();
    openSheet({ mode: 'renamecat', catId: id });
  });
  $('menuDelete').addEventListener('click', () => {
    const c = catById(menuCat);
    closeMenu();
    if (!c) return;
    const index = cats.indexOf(c);
    const removed = tasks.filter((t) => t.cat === c.id).map((t) => Object.assign({}, t));
    cats = cats.filter((x) => x !== c);
    tasks = tasks.filter((t) => t.cat !== c.id);
    saveCats(); save(); render();
    toast('Usunięto „' + shortText(c.name) + '”' + (removed.length ? ' i ' + zadan(removed.length) : ''), () => {
      cats.splice(Math.min(index, cats.length), 0, c);
      tasks = tasks.concat(removed);
      saveCats(); save(); render();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('summary').hidden) $('summaryOk').click();
    else if (!$('menu').hidden) closeMenu();
    else if (!$('sheet').hidden) closeSheet();
  });

  // ---------- Dotknięcia na liście ----------
  const lists = $('lists');

  lists.addEventListener('click', (e) => {
    if (Date.now() < suppressClickUntil) return; // klik po zakończonym geście

    const sec = e.target.closest('.cat');
    if (e.target.closest('.cat-toggle')) {
      if (sec.dataset.section === 'dailydone') {
        dailyDoneCollapsed = !dailyDoneCollapsed;
        lsSet(LS_DAILY_FOLD, dailyDoneCollapsed ? '1' : '0');
        render();
        return;
      }
      const c = catById(sec.dataset.cat);
      if (c) { c.collapsed = !c.collapsed; saveCats(); render(); }
      return;
    }
    if (e.target.closest('.cat-add')) { openSheet({ mode: 'add', catId: sec.dataset.cat }); return; }
    if (e.target.closest('.cat-more')) { openMenu(sec.dataset.cat); return; }

    const li = e.target.closest('.item');
    if (!li) return;
    if (li.dataset.kind === 'daily') {
      const d = dailies.find((x) => x.id === li.dataset.id);
      if (!d) return;
      if (e.target.closest('.text')) openSheet({ mode: 'editdaily', taskId: d.id });
      return;
    }
    const t = tasks.find((x) => x.id === li.dataset.id);
    if (!t) return;
    if (e.target.closest('.text')) openSheet({ mode: 'edit', taskId: t.id });
  });

  // ---------- Gesty: przesunięcie w lewo / w prawo i przeciąganie za ≡ ----------
  let gesture = null;          // trwający gest: 'pending' | 'swipe' | 'drag'
  let suppressClickUntil = 0;
  let animating = false;       // trwa animacja odhaczania

  lists.addEventListener('pointerdown', (e) => {
    if (gesture || animating) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const li = e.target.closest('.item');
    if (!li) return;
    if (e.target.closest('.grip')) {
      e.preventDefault();
      startDrag(li, e);
    } else {
      gesture = { type: 'pending', li: li, id: e.pointerId, x: e.clientX, y: e.clientY };
    }
  });

  window.addEventListener('pointermove', (e) => {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;

    if (g.type === 'pending') {
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        g.type = 'swipe';
        g.row = g.li.querySelector('.row');
        g.width = g.li.offsetWidth;
        try { g.li.setPointerCapture(e.pointerId); } catch (err) {}
      } else if (Math.abs(dy) > 10) {
        gesture = null; // to przewijanie listy, nie gest
        return;
      } else {
        return;
      }
    }

    if (g.type === 'swipe') {
      e.preventDefault();
      g.dx = e.clientX - g.x;
      g.row.style.transform = 'translateX(' + g.dx + 'px)';
      g.li.classList.toggle('to-right', g.dx > 0);
      g.li.classList.toggle('armed', Math.abs(g.dx) > g.width * 0.35);
    } else if (g.type === 'drag') {
      e.preventDefault();
      g.clientY = e.clientY;
      dragUpdate();
    }
  }, { passive: false });

  function endGesture(e, cancelled) {
    const g = gesture;
    if (!g || e.pointerId !== g.id) return;
    gesture = null;
    if (g.type === 'swipe') {
      suppressClickUntil = Date.now() + 400;
      if (!cancelled && g.li.classList.contains('armed')) completeBySwipe(g);
      else snapBack(g);
    } else if (g.type === 'drag') {
      suppressClickUntil = Date.now() + 400;
      endDrag(g, cancelled);
    }
  }
  window.addEventListener('pointerup', (e) => endGesture(e, false));
  window.addEventListener('pointercancel', (e) => endGesture(e, true));

  function snapBack(g) {
    g.row.style.transition = 'transform .2s ease';
    g.row.style.transform = '';
    g.li.classList.remove('armed');
    setTimeout(() => { g.row.style.transition = ''; g.li.classList.remove('to-right'); }, 220);
  }

  // Gest do końca: zadanie odjeżdża, tło na chwilę świeci (zielone / niebieskie / czerwone), wiersz się zwija.
  // W prawo = zrobione lub przywróć, w lewo = usuń.
  function completeBySwipe(g) {
    const isDaily = g.li.dataset.kind === 'daily';
    const t = (isDaily ? dailies : tasks).find((x) => x.id === g.li.dataset.id);
    if (!t) { snapBack(g); return; }
    const toRight = g.dx > 0;
    animating = true;
    g.row.style.transition = 'transform .2s ease-out';
    g.row.style.transform = toRight ? 'translateX(100%)' : 'translateX(-100%)';
    setTimeout(() => {
      g.li.style.height = g.li.offsetHeight + 'px';
      g.li.classList.add('collapsing');
      void g.li.offsetHeight;
      g.li.style.height = '0px';
    }, 450);
    setTimeout(() => {
      animating = false;
      if (isDaily) {
        if (!toRight) {
          const copy = Object.assign({}, t);
          removeDaily(t.id);
          toast('Usunięto codzienne: „' + shortText(copy.text) + '”', () => addDaily(copy));
          return;
        }
        const nowDone = !doneToday(t);
        setDailyDone(t.id, nowDone);
        toast((nowDone ? 'Zrobione na dziś: „' : 'Przywrócono: „') + shortText(t.text) + '” · '
          + (nowDone ? '+' : '−') + monet(COINS_DAILY), () => setDailyDone(t.id, !nowDone));
        return;
      }
      if (!toRight) {
        const copy = Object.assign({}, t);
        removeTasks([t.id]);
        toast('Usunięto: „' + shortText(copy.text) + '”', () => addTask(copy));
        return;
      }
      const nowDone = !t.done;
      setDone(t.id, nowDone);
      toast((nowDone ? 'Zrobione: „' : 'Przywrócono: „') + shortText(t.text) + '” · '
        + (nowDone ? '+' : '−') + monet(COINS_TASK), () => setDone(t.id, !nowDone));
    }, 700);
  }

  // Przeciąganie działa w obrębie jednej listy (jednej kategorii)
  function startDrag(li, e) {
    const items = Array.from(li.parentElement.children).filter((el) => el.classList.contains('item'));
    const from = items.indexOf(li);
    const rects = items.map((el) => {
      const r = el.getBoundingClientRect();
      return { top: r.top + window.scrollY, h: r.height };
    });
    gesture = {
      type: 'drag', id: e.pointerId, li: li, items: items, from: from, to: from,
      lo: 0, hi: items.length - 1, rects: rects, startY: e.clientY + window.scrollY, clientY: e.clientY
    };
    li.classList.add('dragging');
    items.forEach((el) => { if (el !== li) el.classList.add('shifting'); });
    try { e.target.closest('.grip').setPointerCapture(e.pointerId); } catch (err) {}
    gesture.raf = requestAnimationFrame(autoScroll);
  }

  function dragUpdate() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const r = g.rects, me = r[g.from];
    let dy = g.clientY + window.scrollY - g.startY;
    const minDy = r[g.lo].top - me.top;
    const maxDy = r[g.hi].top + r[g.hi].h - (me.top + me.h);
    dy = Math.max(minDy, Math.min(maxDy, dy));
    g.li.style.transform = 'translateY(' + dy + 'px)';

    // Zadanie zajmuje miejsce sąsiada, gdy jego krawędź minie połowę tego sąsiada
    const top = me.top + dy, bottom = top + me.h;
    let to = g.from;
    for (let i = g.from + 1; i <= g.hi; i++) if (bottom > r[i].top + r[i].h / 2) to = i;
    for (let i = g.from - 1; i >= g.lo; i--) if (top < r[i].top + r[i].h / 2) to = i;
    g.to = to;

    g.items.forEach((el, i) => {
      if (i === g.from) return;
      let shift = 0;
      if (g.from < i && i <= to) shift = -me.h;
      else if (to <= i && i < g.from) shift = me.h;
      el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
    });
  }

  // Gdy palec jest przy górnej lub dolnej krawędzi ekranu, lista sama się przewija
  function autoScroll() {
    const g = gesture;
    if (!g || g.type !== 'drag') return;
    const edge = 80;
    let v = 0;
    if (g.clientY < edge) v = -(edge - g.clientY) / 6;
    else if (g.clientY > window.innerHeight - edge) v = (g.clientY - (window.innerHeight - edge)) / 6;
    if (v) { window.scrollBy(0, v); dragUpdate(); }
    g.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(g, cancelled) {
    cancelAnimationFrame(g.raf);
    if (!cancelled && g.to !== g.from) {
      const ids = g.items.slice(g.lo, g.hi + 1).map((el) => el.dataset.id);
      if (g.li.dataset.kind === 'daily') { moveItems(dailies, ids, g.from - g.lo, g.to - g.lo); saveDaily(); }
      else { moveItems(tasks, ids, g.from - g.lo, g.to - g.lo); save(); }
    }
    render();
  }

  $('clearDone').addEventListener('click', () => {
    const doneTasks = tasks.filter((t) => t.done).map((t) => Object.assign({}, t));
    if (!doneTasks.length) return;
    removeTasks(doneTasks.map((t) => t.id));
    toast('Usunięto zrobione: ' + doneTasks.length, () => {
      tasks = tasks.concat(doneTasks); save(); render();
    });
  });

  document.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    filter = b.dataset.filter;
    lsSet(LS_FILTER, filter);
    render();
  });

  // ---------- Start ----------
  const savedFilter = lsGet(LS_FILTER);
  if (savedFilter === 'active' || savedFilter === 'done' || savedFilter === 'daily') filter = savedFilter;

  function showDate() {
    try {
      $('today').textContent = new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {}
  }

  showDate();
  load();
  const startSummary = settleDays();
  render();
  renderProfile(false);
  if (startSummary) showSummary(startSummary);

  // Nowy dzień: codzienne zadania wracają same, a poprzedni dzień zostaje rozliczony (monety / HP).
  // Sprawdzamy co pół minuty i przy każdym powrocie do appki (np. rano, gdy była otwarta w tle przez noc).
  let shownDay = today();
  function checkNewDay() {
    if (today() === shownDay) return;
    shownDay = today();
    showDate();
    const r = settleDays();
    if (!gesture && !animating) render();
    renderProfile(false);
    if (r) showSummary(r);
  }
  setInterval(checkNewDay, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
  window.addEventListener('focus', checkNewDay);

  // Prośba, by system nie czyścił zapisanych zadań
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  // Działanie offline
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
